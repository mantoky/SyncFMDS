<script>
const SCRIPT_SEG=`Sejam bem-vindos ao FMDS Infratech, Carajas - Corredor Norte.

Antes de iniciarmos, atencao as premissas de seguranca.

Em caso de emergencia nas operacoes da Vale, acione o CECOM: 0800 2850 193.

Identifique as saidas de emergencia sinalizadas. Em caso de evacuacao, siga o trajeto definido. Nao improvise caminhos. Mantenha a calma.

Guias de evacuacao:
G1 - Guia de frente: abre o caminho e conduz o grupo ao Ponto de Encontro N78.
G2 - Guia de retaguarda: ultimo a sair, certifica que ninguem ficou para tras.

Use o radio em emergencias: acione o botao vermelho e comunique-se na faixa dos Bombeiros. Informe localizacao, tipo de ocorrencia e numero de pessoas.

Contatos: CECOM 0800 2850 193 - Bombeiros 193 - SAMU 192.

A vida em primeiro lugar. Iniciando o FMDS.`;
const EVAC_ROTAS_BASE=`O G1 (guia 1) conduzira a evacuacao, seguindo pela porta de emergencia mais proxima, em fila indiana. Todos deverao seguir pela area externa do predio Infratech, passando pelo predio de Sondagem. Havera uma curva suave a esquerda, contornando o inicio das rampas de onibus. Manter a direcao em linha reta (exceto quando houver obstrucoes por pessoas, materiais, bloqueios etc.). Ao fim deste corredor, havera uma saida da area coberta (curva suave a esquerda), que direcionara todos a Praca da Bandeira. Seguindo adiante, havera uma escada dividida por um corrimao, e todos deverao, ordenadamente, direcionar-se ao PONTO DE ENCONTRO (PE N78), logo apos o estacionamento do CCO, ao lado do Heliponto.

Obs:
Caso o G1 (guia 1) entenda que outro caminho seguro (atalho - rota estabelecida) seja a melhor opcao, todos deverao segui-lo, conforme este plano estabelece.`;
const EVAC_DEFAULT_FIELDS={

const COMPANIES=[
  {id:"plano_evac",name:"Plano de Evacuacao",sub:"Premissas - Rotas - Emergencia",ac:"#006B3F",mins:6,mode:"agent",init:"PE",script:SCRIPT_SEG,

  {id:"sonda_net",name:"Sonda Network",sub:"Network - Corporativo",ac:"#6FCF97",mins:7,mode:"agent",init:"SN",script:"Bloco Sonda Network. Escopo: Rede corporativa.",

  {id:"stefanini",name:"Stefanini",sub:"Analistas - Projetos - VPS",ac:"#F472B6",mins:7,mode:"agent",init:"ST",script:"Bloco Stefanini. Escopo: Analistas de tecnologia, projetos e VPS.",
   fields:[{k:"seg",l:"Seguranca",p:"Campo, ergonomia..."},{k:"d1",l:"Atividades D-1",p:"Projeto - Chamado - Status"},{k:"d",l:"Atividades D",p:"Fila, VPS, projetos..."},{k:"crit",l:"Escaladas criticas",p:"VPS, seguranca da informacao..."},{k:"ajuda",l:"Alinhamentos",p:"Vale, contratadas..."},{k:"sob",l:"Sobreaviso",p:"Nome - Contato"}]},
  {id:"vale_close",name:"Vale",sub:"SESMT - Coordenacao - Gestao",ac:"#006B3F",mins:6,mode:"human",init:"VA",script:"Encerramento do FMDS. Comunicados de SESMT e alinhamentos finais.",
   fields:[{k:"sesmt",l:"Comunicados SESMT",p:"Normas, alertas, campanhas..."},{k:"dir",l:"Diretivas do dia",p:"Prioridades, decisoes..."},{k:"alin",l:"Alinhamentos finais",p:"Pendentes, confirmacoes..."}]},
  {id:"sesmt",name:"SESMT",sub:"Saude - Seguranca - Alertas",ac:"#27AE60",mins:6,mode:"agent",init:"SE",script:"Bloco SESMT. Escopo: saude, seguranca ocupacional e alertas preventivos.",
   fields:[{k:"alertas",l:"Alertas de seguranca",p:"Alertas, desvios, campanhas..."},{k:"inspecoes",l:"Inspecoes e acoes",p:"Acoes realizadas e pendentes..."},{k:"treinamentos",l:"Treinamentos",p:"Programacao, vencimentos, publico..."},{k:"recomendacoes",l:"Recomendacoes",p:"Orientacoes para o dia..."}]},
  {id:"sonda_lte",name:"Sonda LTE",sub:"LTE - Automacao - Mina",ac:"#2F80ED",mins:8,mode:"agent",init:"SL",script:"Bloco Sonda LTE. Escopo: LTE, automacao e operacoes de mina.",
   fields:[{k:"seg",l:"Seguranca",p:"Desvios, riscos..."},{k:"d1",l:"Programacao D-1",p:"Site - Chamado - Status"},{k:"d",l:"Programacao D",p:"Site - Chamado - Status"},{k:"crit",l:"Tratativas criticas",p:"Links LTE, falhas..."},{k:"ajuda",l:"Pedidos de apoio",p:"Dependencias..."},{k:"sob",l:"Sobreaviso",p:"Nome - Cargo - Contato"}]},
  {id:"kpis",name:"KPI'S",sub:"Indicadores - SLA - Tendencias",ac:"#F59E0B",mins:5,mode:"agent",init:"KP",script:"Bloco KPI'S. Escopo: indicadores operacionais, SLA e pontos de atencao.",
   fields:[{k:"disp",l:"Disponibilidade",p:"Disponibilidade, indisponibilidades, impactos..."},{k:"sla",l:"SLA",p:"Cumprimento, violacoes, tratativas..."},{k:"backlog",l:"Backlog",p:"Abertos, encerrados, criticos..."},{k:"tendencias",l:"Tendencias",p:"Evolucao dos indicadores e alertas..."}]},
];

let S={
  view:"portal",selId:null,
  enabled:Object.fromEntries(COMPANIES.map(c=>[c.id,true])),
  data:Object.fromEntries(COMPANIES.map(c=>[c.id,Object.fromEntries(c.fields.map(f=>[f.k,""]))])),
  imgs:Object.fromEntries(COMPANIES.map(c=>[c.id,[]])),
  evacImages:[null,null,null],
  evacScript:SCRIPT_SEG,
  modalImg:null,
  modalList:[],
  modalIdx:0,
  presIdx:0,bSecs:0,tSecs:0,running:false,manual:false,overflow:false,speaking:false,
  theme:"day",
  role:"editor"
};
S.weather={
  loading:false,error:"",source:"INMET",updatedAt:"",
  collapsed:false,
  items:[
    {name:"Parauapebas",now:"-",temp:"-",hum:"-",wind:"-",next3h:"-"},
    {name:"Serra dos Carajas - Corredor Norte",now:"-",temp:"-",hum:"-",wind:"-",next3h:"-"},
    {name:"Mina de Ferro Carajas",now:"-",temp:"-",hum:"-",wind:"-",next3h:"-"}
  ]
};
S.data["plano_evac"]={...EVAC_DEFAULT_FIELDS,...S.data["plano_evac"]};

let cInt=null,tInt=null;
let wInt=null;
const synth=window.speechSynthesis;
const EVAC_IMG_KEY="fmds_evac_images_v1";
const EVAC_SCRIPT_KEY="fmds_evac_script_v1";
const EVAC_SCRIPT_BASE_KEY="fmds_evac_script_base_v1";
const EVAC_FIELDS_BASE_KEY="fmds_evac_fields_base_v1";
const APP_STATE_KEY="fmds_app_state_v2";
const ADMIN_USER="Admin";
const ADMIN_PASS="FrontForBack**updapte%%editorFull%";
const ADMIN_RECOVERY_EMAIL="mantoky@gmail.com";
const fmt=s=>`${String(Math.floor(Math.abs(s)/60)).padStart(2,"0")}:${String(Math.abs(s)%60).padStart(2,"0")}`;
const activeCompanies=()=>COMPANIES.filter(c=>S.enabled[c.id]);
const totalSecs=()=>activeCompanies().reduce((s,c)=>s+c.mins*60,0);
const filled=id=>{
  if(id==="plano_evac")return S.evacImages.some(Boolean)||COMPANIES[0].fields.some(f=>S.data[id][f.k]?.trim());
  return COMPANIES.find(c=>c.id===id)?.fields.some(f=>S.data[id][f.k]?.trim())||S.imgs[id]?.length>0;
};
const fCount=()=>COMPANIES.filter(c=>S.enabled[c.id]&&filled(c.id)).length;
const cIdx=id=>COMPANIES.findIndex(c=>c.id===id);

function buildScript(c){
  if(c.id==="plano_evac")return S.evacScript;
  let t=c.script+" ";
  c.fields.forEach(f=>{if(S.data[c.id][f.k]?.trim())t+=f.l+": "+S.data[c.id][f.k]+". ";});
  return t;
}
function doSpeak(txt){
  if(!synth)return;synth.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  u.lang="pt-BR";u.rate=0.88;
  const vs=synth.getVoices().filter(v=>v.lang.startsWith("pt"));
  if(vs.length)u.voice=vs[0];
  u.onend=u.onerror=()=>{S.speaking=false;updSUI();};
  synth.speak(u);S.speaking=true;updSUI();
}
function readStore(k,fb){
  try{
    const v=localStorage.getItem(k);
    return v?JSON.parse(v):fb;
  }catch(_){return fb;}
}
function writeStore(k,v){
  try{localStorage.setItem(k,JSON.stringify(v));}catch(_){}
}
function loadEvacState(){
  const imgs=readStore(EVAC_IMG_KEY,null);
  const txt=readStore(EVAC_SCRIPT_KEY,null);
  const base=readStore(EVAC_SCRIPT_BASE_KEY,null);
  const fieldsBase=readStore(EVAC_FIELDS_BASE_KEY,null);
  if(Array.isArray(imgs)&&imgs.length===3)S.evacImages=imgs;
  if(typeof txt==="string"&&txt.trim())S.evacScript=txt;
  if(typeof base!=="string"||!base.trim())writeStore(EVAC_SCRIPT_BASE_KEY,S.evacScript);
  if(fieldsBase&&typeof fieldsBase==="object")S.data["plano_evac"]={...EVAC_DEFAULT_FIELDS,...fieldsBase,...S.data["plano_evac"]};
}
function saveEvacImages(){writeStore(EVAC_IMG_KEY,S.evacImages);}
function saveEvacScript(){writeStore(EVAC_SCRIPT_KEY,S.evacScript);}
function saveEvacBase(){writeStore(EVAC_SCRIPT_BASE_KEY,S.evacScript);}
function saveEvacFieldsBase(){writeStore(EVAC_FIELDS_BASE_KEY,S.data["plano_evac"]);}
function restoreEvacBase(){
  const base=readStore(EVAC_SCRIPT_BASE_KEY,SCRIPT_SEG);
  S.evacScript=typeof base==="string"&&base.trim()?base:SCRIPT_SEG;
  saveEvacScript();
}
function restoreEvacFieldsBase(){
  const base=readStore(EVAC_FIELDS_BASE_KEY,EVAC_DEFAULT_FIELDS);
  if(base&&typeof base==="object")S.data["plano_evac"]={...S.data["plano_evac"],...EVAC_DEFAULT_FIELDS,...base};
}
function allModalImages(){
  const evac=S.evacImages.filter(Boolean).map(x=>x.url);
  const block=Object.values(S.imgs).flat().map(x=>x.url);
  return [...new Set([...evac,...block])];
}
function saveAppState(){
  writeStore(APP_STATE_KEY,{
    enabled:S.enabled,data:S.data,imgs:S.imgs,
    evacImages:S.evacImages,evacScript:S.evacScript,
    theme:S.theme,role:S.role
  });
}
function askAdminLogin(){
  const u=prompt("Usuario administrador:");
  if(u===null)return false;
  const p=prompt("Senha do administrador:");
  if(p===null)return false;
  if(u===ADMIN_USER&&p===ADMIN_PASS)return true;
  alert("Credenciais invalidas. Recuperacao: "+ADMIN_RECOVERY_EMAIL);
  return false;
}
function loadAppState(){
  const st=readStore(APP_STATE_KEY,null);
  if(!st)return;
  if(st.enabled&&typeof st.enabled==="object")S.enabled={...S.enabled,...st.enabled};
  if(st.data&&typeof st.data==="object")S.data={...S.data,...st.data};
  if(st.imgs&&typeof st.imgs==="object")S.imgs={...S.imgs,...st.imgs};
  if(Array.isArray(st.evacImages)&&st.evacImages.length===3)S.evacImages=st.evacImages;
  if(typeof st.evacScript==="string"&&st.evacScript.trim())S.evacScript=st.evacScript;
  if(st.theme==="day"||st.theme==="night")S.theme=st.theme;
  if(st.role==="admin"||st.role==="editor")S.role=st.role;
  if(st.weather&&typeof st.weather==="object")S.weather={...S.weather,...st.weather};
  S.data["plano_evac"]={...EVAC_DEFAULT_FIELDS,...S.data["plano_evac"]};
}
function weatherSummary(v){
  if(!v)return"-";
  const s=String(v).toLowerCase();
  if(s.includes("chuva"))return "Chuva";
  if(s.includes("nublado"))return "Nublado";
  if(s.includes("sol"))return "Ensolarado";
  return String(v);
}
async function fetchWeatherFromInmet(){
  S.weather.loading=true;S.weather.error="";re();
  const targets=[
    {place:"parauapebas",name:"Parauapebas"},
    {place:"parauapebas",name:"Serra dos Carajas - Corredor Norte"},
    {place:"parauapebas",name:"Mina de Ferro Carajas"}
  ];
  try{
    let usedProxy=false;
    const rows=[];
    for(const t of targets){
      let j=null, stale=false;
      try{
        const purl=`http://127.0.0.1:8090/weather?place=${encodeURIComponent(t.place)}`;
        const pr=await fetch(purl,{cache:"no-store"});
        if(pr.ok){
          const pj=await pr.json();
          if(pj&&pj.ok&&pj.data){j=pj.data;usedProxy=true;stale=!!pj.stale;}
        }
      }catch(_){}
      if(!j||!j.forecast)throw new Error("sem_dados_proxy");
      const root=j.forecast||{};
      const geo=Object.keys(root||{})[0];
      const byDate=(geo&&root[geo])?root[geo]:root;
      const days=Object.keys(byDate||{}).sort((a,b)=>{
        const pa=a.split("/").reverse().join("-");
        const pb=b.split("/").reverse().join("-");
        return pa.localeCompare(pb);
      });
      const d=days[0]&&byDate[days[0]]?byDate[days[0]]:{};
      const seq=["manha","tarde","noite"].map(k=>d[k]).filter(Boolean);
      const now=seq[0]||{}, nxt=seq[1]||seq[0]||{};
      rows.push({
        name:t.name,
        now:weatherSummary(now.resumo||now.tempo||now.ceu||"-")+(stale?" (cache)":""),
        temp:(now.temp_max&&now.temp_min)?`${now.temp_min}C a ${now.temp_max}C`:(now.temp||"-"),
        hum:now.umidade_max?`${now.umidade_min||"-"}% a ${now.umidade_max}%`:(now.umidade||"-"),
        wind:now.vento||now.int_vento||"-",
        next3h:weatherSummary(nxt.resumo||nxt.tempo||nxt.ceu||"-")
      });
    }
    S.weather.items=rows;
    S.weather.updatedAt=new Date().toLocaleTimeString("pt-BR");
    S.weather.source=usedProxy?"INMET / Proxy local":"INMET";
  }catch(_){
    S.weather.error="Falha ao consultar INMET em tempo real no navegador.";
  }finally{
    S.weather.loading=false;re();
  }
}
function stopSpeak(){synth&&synth.cancel();S.speaking=false;updSUI();}
function updSUI(){
  const b=document.getElementById("sp-btn"),w=document.getElementById("sp-wv");
  if(b){b.textContent=S.speaking?"Parar":"Narrador Virtual";b.style.background=S.speaking?"var(--bt)":"transparent";b.style.color=S.speaking?"#fff":"var(--bt)";}
  if(w)w.style.display=S.speaking?"inline-flex":"none";
}
function startTimer(){clearInterval(tInt);S.running=true;tInt=setInterval(()=>{S.bSecs++;S.tSecs++;updTimer();},1000);}
function stopTimer(){clearInterval(tInt);S.running=false;}
function updTimer(){
  const c=activeCompanies()[S.presIdx];if(!c)return;
  const lim=c.mins*60,left=lim-S.bSecs,pct=Math.min(100,S.bSecs/lim*100);
  const total=totalSecs();
  const td=document.getElementById("td"),tb=document.getElementById("tb"),totb=document.getElementById("totb"),totd=document.getElementById("totd");
  if(td){td.textContent=left>=0?fmt(left):"-"+fmt(-left);td.style.color=left<60?"var(--cr)":left<120?"var(--al)":"var(--gr)";}
  if(tb){tb.style.width=pct+"%";tb.style.background=pct>90?"var(--cr)":pct>70?"var(--al)":c.ac;}
  if(totb)totb.style.width=Math.min(100,S.tSecs/Math.max(total,1)*100)+"%";
  if(totd)totd.textContent=fmt(S.tSecs)+" / "+fmt(total);
}

    <div style="font-size:32px;color:var(--gv);margin-bottom:8px">OK</div>
    <div style="font-size:16px;font-weight:500;color:var(--gr);margin-bottom:4px">FMDS encerrado</div>
    <div style="font-size:12px;color:var(--cm);margin-bottom:1.25rem">Duracao: ${fmt(S.tSecs)} / ${fmt(totalSecs())}</div>
    <button onclick="goHome()" style="padding:.5rem 1.5rem;border-radius:8px;background:var(--gv);border:none;color:#fff;font-weight:500;font-size:13px;cursor:pointer">Inicio</button>
  </div>`;

  const c=actives[S.presIdx];
  const isEvac=c.id==="plano_evac";
  const flds=c.fields.filter(f=>S.data[c.id][f.k]?.trim());
  const evacBlock=isEvac?`
    <div style="background:#F0F7FF;border:.5px solid #BFDBFE;border-radius:7px;padding:.6rem .75rem;margin-bottom:.5rem">
      <div style="font-size:9px;font-weight:500;color:var(--bt);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.35rem">Inicio FMDS - Premissas de Seguranca</div>
      <div style="font-size:11px;color:var(--gr);line-height:1.6;white-space:pre-wrap;max-height:110px;overflow-y:auto">${S.evacScript}</div>
    </div>
    <div style="display:flex;gap:5px;margin-bottom:.5rem">
      ${S.evacImages.map((img,i)=>img
        ?`<div style="flex:1;cursor:pointer" onclick="openModal('${img.url}')">
            <img src="${img.url}" style="width:100%;height:48px;object-fit:cover;border-radius:6px;border:.5px solid var(--cc)"/>
            <div style="font-size:8px;color:var(--bt);text-align:center;margin-top:2px">Imagem ${i+1} - clique para ampliar</div>
          </div>`
        :`<div style="flex:1;height:48px;background:var(--bg);border:.5px dashed var(--cc);border-radius:6px;display:flex;align-items:center;justify-content:center">
            <span style="font-size:8px;color:#C4C9D4">Img ${i+1}</span>
          </div>`
      ).join("")}
    </div>`:"";
  const dataHTML=flds.length?flds.map(f=>`
    <div style="background:var(--bg);border-radius:6px;padding:.4rem .65rem;border-left:2px solid ${c.ac}55;margin-bottom:4px">
      <div style="font-size:9px;font-weight:500;color:${c.ac};text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px">${f.l}</div>
      <div style="font-size:12px;color:var(--gr);line-height:1.5;white-space:pre-wrap">${S.data[c.id][f.k]}</div>
    </div>`).join(""):(isEvac?"":(`<div style="font-size:11px;color:var(--cm);font-style:italic">Script padrao do agente.</div>`));
  const imgH=S.imgs[c.id]?.length?`<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:5px">${S.imgs[c.id].map((img,i)=>`<img src="${img.url}" onclick="openModal('${img.url}')" style="height:48px;border-radius:6px;border:.5px solid var(--cc);cursor:pointer"/>`).join("")}</div>`:"";
  const ovH=S.overflow?`<div style="background:#FFFBEB;border:.5px solid var(--al);border-radius:8px;padding:.65rem;margin-bottom:.65rem">
    <div style="font-size:11px;font-weight:500;color:#92400E;margin-bottom:2px">Tempo Overflow Session</div>
    <div style="font-size:10px;color:#B45309">Tempo excedido. Sugestao: +10 min. Registre na ata.</div>
  </div>`:"";

  return`<div>
    <div style="background:linear-gradient(90deg,var(--gv),var(--bt));padding:.55rem .85rem;border-radius:8px;margin-bottom:.7rem;display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;align-items:center;gap:5px">
        <button onclick="goHome()" style="padding:3px 8px;border-radius:5px;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:10px;cursor:pointer">Inicio</button>
        <button onclick="prevBlock()" ${S.presIdx===0?"disabled":""} style="padding:3px 8px;border-radius:5px;background:${S.presIdx===0?"transparent":"rgba(255,255,255,.15)"};border:none;color:${S.presIdx===0?"rgba(255,255,255,.3)":"#fff"};font-size:10px;cursor:${S.presIdx===0?"default":"pointer"}">< Voltar</button>
      </div>
      <div id="totd" style="font-size:10px;color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums">00:00 / ${fmt(totalSecs())}</div>
    </div>
    <div style="height:3px;background:var(--cc);border-radius:2px;overflow:hidden;margin-bottom:.7rem">
      <div id="totb" style="height:3px;background:var(--gv);border-radius:2px;width:0%;transition:width .5s"></div>
    </div>
    <div style="background:var(--wh);border:.5px solid var(--cc);border-left:3px solid ${c.ac};border-radius:8px;padding:.85rem;margin-bottom:.6rem">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:.6rem">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:32px;height:32px;border-radius:50%;background:${c.ac}18;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:${c.ac}">${c.init}</div>
          <div><div style="font-size:14px;font-weight:500;color:var(--gr)">${c.name}</div><div style="font-size:10px;color:var(--cm)">${c.sub}</div></div>
        </div>
        <div style="text-align:right">
          <div id="td" style="font-size:22px;font-weight:500;color:var(--gr);font-variant-numeric:tabular-nums">--:--</div>
          <div style="font-size:9px;color:var(--cm)">restante</div>
        </div>
      </div>
      <div style="height:3px;background:var(--cc);border-radius:2px;overflow:hidden;margin-bottom:.6rem">
        <div id="tb" style="height:3px;border-radius:2px;background:${c.ac};width:0%;transition:width .5s"></div>
      </div>
      <div style="background:var(--bg);border:.5px solid var(--cc);border-radius:6px;padding:.45rem .65rem;margin-bottom:.6rem;display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:6px">
          <div style="width:6px;height:6px;border-radius:50%;background:${S.manual?"var(--al)":"var(--bt)"};animation:pulse 1.4s infinite"></div>
          <div style="font-size:10px;color:${S.manual?"#92400E":"var(--bt)"};font-weight:500">${S.manual?"Apresentador conduz":"Agente virtual ativo"}</div>
          <div id="sp-wv" class="wv" style="display:${S.speaking?"inline-flex":"none"}"><span></span><span></span><span></span><span></span><span></span></div>
        </div>
        <button id="sp-btn" onclick="toggleSpeak()" style="padding:3px 10px;border-radius:20px;background:${S.speaking?"var(--bt)":"transparent"};border:1px solid var(--bt);color:${S.speaking?"#fff":"var(--bt)"};font-size:10px;cursor:pointer;font-weight:500">${S.speaking?"Parar":"Narrador Virtual"}</button>
      </div>
      ${evacBlock}${dataHTML}${imgH}
    </div>
    ${ovH}
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button onclick="toggleRun()" style="padding:.38rem .85rem;border-radius:7px;background:transparent;border:1px solid var(--cc);color:var(--cm);font-size:11px;cursor:pointer">${S.running?"Pausar Pausar":"Retomar Retomar"}</button>
      <button onclick="toggleManual()" style="padding:.38rem .85rem;border-radius:7px;background:transparent;border:1px solid ${S.manual?"var(--al)":"var(--cc)"};color:${S.manual?"#92400E":"var(--cm)"};font-size:11px;cursor:pointer">${S.manual?"< Agente":"Assumir"}</button>
      <button onclick="toggleOverflow()" style="padding:.38rem .85rem;border-radius:7px;background:transparent;border:1px solid ${S.overflow?"var(--al)":"var(--cc)"};color:${S.overflow?"#92400E":"var(--cm)"};font-size:11px;cursor:pointer">Overflow</button>
      <button onclick="nextBlock()" style="flex:1;padding:.38rem .85rem;border-radius:7px;background:var(--gv);border:none;color:#fff;font-weight:500;font-size:11px;cursor:pointer">Proximo ></button>
    </div>
  </div>`;
}

//  MODAL 
function renderModal(){
  if(!S.modalImg)return"";
  const hasNav=S.modalList.length>1;
  return`<div onclick="closeModal()" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.88);z-index:9999;display:flex;align-items:center;justify-content:center;padding:.35rem">
    <div onclick="event.stopPropagation()" style="width:90vw;height:90vh;max-width:90vw;max-height:90vh;background:var(--wh);border-radius:10px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);display:flex;flex-direction:column">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:.5rem .85rem;background:var(--gv)">
        <span style="font-size:11px;color:rgba(255,255,255,.8)">Exibicao - Plano de evacuacao</span>
        <div style="display:flex;align-items:center;gap:8px">
          ${hasNav?`<span style="font-size:11px;color:rgba(255,255,255,.8)">${S.modalIdx+1}/${S.modalList.length}</span>`:""}
          <button onclick="closeModal()" style="background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:4px;padding:3px 9px;font-size:12px;cursor:pointer;font-weight:500">X Fechar</button>
        </div>
      </div>
      <div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:.2rem;position:relative">
        ${hasNav?`<button onclick="prevModalImage()" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:none;background:rgba(0,107,63,.75);color:#fff;font-size:18px;cursor:pointer;z-index:2"><</button>`:""}
        <img src="${S.modalImg}" style="max-width:100%;max-height:100%;width:auto;height:auto;display:block;object-fit:contain"/>
        ${hasNav?`<button onclick="nextModalImage()" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:none;background:rgba(0,107,63,.75);color:#fff;font-size:18px;cursor:pointer;z-index:2">></button>`:""}
      </div>
    </div>
  </div>`;
}

//  MAIN RENDER 
function renderMain(){
  if(S.view==="portal")return renderPortal();
  if(S.view==="workspace")return S.selId==="plano_evac"?renderEvacWS():renderGenericWS();
  if(S.view==="present")return renderPresent();
  return"";
}

function re(){
  document.body.classList.toggle("night",S.theme==="night");
  const app=document.getElementById("app");
  app.innerHTML=renderSidebar()
    +`<div id="main" class="fade" style="flex:1;padding:.85rem;overflow-y:auto;background:var(--bg)">${renderMain()}</div>`
    +renderModal();
  attachEv();
  if(S.view==="present"&&S.running)updTimer();
  if(S.view==="present")updSUI();
}

function attachEv(){
  if(S.view==="workspace"){
    if(S.selId==="plano_evac"){
      const sc=document.getElementById("evac-script");
      if(sc)sc.addEventListener("input",e=>{S.evacScript=e.target.value;saveEvacScript();saveAppState();});
      COMPANIES[0].fields.forEach(f=>{const el=document.getElementById("f_"+f.k);if(el)el.addEventListener("input",e=>{S.data["plano_evac"][f.k]=e.target.value;saveAppState();});});
    } else {
      const c=COMPANIES.find(x=>x.id===S.selId);
      if(c){
        c.fields.forEach(f=>{const el=document.getElementById("f_"+f.k);if(el)el.addEventListener("input",e=>{S.data[c.id][f.k]=e.target.value;saveAppState();});});
      }
    }
  }
  clearInterval(cInt);
  cInt=setInterval(()=>{
    const d=new Date();
    const t=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0");
    const el=document.getElementById("sb-clock");
    if(el)el.textContent=t;
  },1000);
}

//  ACTIONS 
function insertVpsImg(n,inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{S.evacImages[n]={url:e.target.result,name:f.name};saveEvacImages();re();};
  r.readAsDataURL(f);
}
function removeVpsImg(n){S.evacImages[n]=null;saveEvacImages();re();}
function exibirImg(n){if(S.evacImages[n])openModal(S.evacImages[n].url);}
function openModal(url){
  const list=allModalImages();
  S.modalList=list.length?list:[url];
  S.modalIdx=Math.max(0,S.modalList.indexOf(url));
  S.modalImg=S.modalList[S.modalIdx]||url;
  re();
}
function prevModalImage(){
  if(!S.modalList.length)return;
  S.modalIdx=(S.modalIdx-1+S.modalList.length)%S.modalList.length;
  S.modalImg=S.modalList[S.modalIdx];
  re();
}
function nextModalImage(){
  if(!S.modalList.length)return;
  S.modalIdx=(S.modalIdx+1)%S.modalList.length;
  S.modalImg=S.modalList[S.modalIdx];
  re();
}
function closeModal(){S.modalImg=null;S.modalList=[];S.modalIdx=0;re();}
function resetScript(){restoreEvacBase();restoreEvacFieldsBase();re();}
function saveScriptBase(){if(S.role!=="admin")return;saveEvacBase();saveEvacFieldsBase();re();}
function handleImg(id,inp){Array.from(inp.files).forEach(f=>{const r=new FileReader();r.onload=e=>{S.imgs[id].push({name:f.name,url:e.target.result});re();};r.readAsDataURL(f);});}
function rmImg(id,i){S.imgs[id].splice(i,1);re();}
function openWS(id){stopSpeak();S.selId=id;S.view="workspace";re();}
function goHome(){stopSpeak();stopTimer();S.view="portal";S.presIdx=0;S.bSecs=0;S.tSecs=0;S.running=false;S.manual=false;S.overflow=false;S.speaking=false;re();}
function saveWS(){S.view="portal";re();}
function startFMDS(){stopSpeak();S.view="present";S.presIdx=0;S.bSecs=0;S.tSecs=0;S.running=false;S.manual=false;S.overflow=false;S.speaking=false;re();setTimeout(()=>{startTimer();updTimer();},100);}
function nextBlock(){stopSpeak();S.presIdx++;S.bSecs=0;S.manual=false;S.overflow=false;stopTimer();re();if(S.presIdx<activeCompanies().length)setTimeout(()=>{startTimer();updTimer();},100);}
function prevBlock(){if(S.presIdx===0)return;stopSpeak();S.presIdx--;S.bSecs=0;S.manual=false;S.overflow=false;stopTimer();re();setTimeout(()=>{startTimer();updTimer();},100);}
function jumpBlock(i){stopSpeak();S.presIdx=i;S.bSecs=0;S.manual=false;S.overflow=false;stopTimer();re();setTimeout(()=>{startTimer();updTimer();},100);}
function jumpBlockById(id){const i=activeCompanies().findIndex(c=>c.id===id);if(i>-1)jumpBlock(i);}
function toggleRun(){if(S.running)stopTimer();else startTimer();re();}
function toggleManual(){S.manual=!S.manual;re();}
function toggleOverflow(){S.overflow=!S.overflow;re();}
function setTheme(mode){if(mode!=="day"&&mode!=="night")return;S.theme=mode;re();}
function toggleTheme(){S.theme=S.theme==="night"?"day":"night";re();}
function resetLocalCache(){
  if(S.role!=="admin")return;
  const ok=confirm("Reinicializar cache local desta aplicacao? Esta acao limpa bases, edicoes e imagens salvas no navegador.");
  if(!ok)return;
  [
    EVAC_IMG_KEY,EVAC_SCRIPT_KEY,EVAC_SCRIPT_BASE_KEY,EVAC_FIELDS_BASE_KEY,APP_STATE_KEY
  ].forEach(k=>{try{localStorage.removeItem(k);}catch(_){}});
  S.enabled=Object.fromEntries(COMPANIES.map(c=>[c.id,true]));
  S.data=Object.fromEntries(COMPANIES.map(c=>[c.id,Object.fromEntries(c.fields.map(f=>[f.k,""]))]));
  S.data["plano_evac"]={...EVAC_DEFAULT_FIELDS,...S.data["plano_evac"]};
  S.imgs=Object.fromEntries(COMPANIES.map(c=>[c.id,[]]));
  S.evacImages=[null,null,null];
  S.evacScript=SCRIPT_SEG;
  S.theme="day";
  S.view="portal";
  S.selId=null;
  S.presIdx=0;S.bSecs=0;S.tSecs=0;S.running=false;S.manual=false;S.overflow=false;S.speaking=false;
  saveAppState();
  saveEvacScript();
  re();
}
function toggleWeatherPanel(){S.weather.collapsed=!S.weather.collapsed;re();}
function toggleRole(){
  if(S.role==="admin"){S.role="editor";re();return;}
  if(askAdminLogin()){S.role="admin";re();}
}
function toggleGuide(id){
  S.enabled[id]=!S.enabled[id];
  if(S.view==="present"){
    const actives=activeCompanies();
    if(S.presIdx>=actives.length)S.presIdx=Math.max(0,actives.length-1);
    S.bSecs=0;S.manual=false;S.overflow=false;stopTimer();
  }
  re();
}
function toggleSpeak(){if(S.speaking){stopSpeak();return;}const c=activeCompanies()[S.presIdx];if(c)doSpeak(buildScript(c));}

const _re=re;
re=function(){_re();saveAppState();};
loadAppState();
loadEvacState();
fetchWeatherFromInmet();
clearInterval(wInt);
wInt=setInterval(fetchWeatherFromInmet,15*60*1000);
re();
</script>
