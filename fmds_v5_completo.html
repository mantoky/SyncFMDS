Contatos: CECOM 0800 2850 193 - Bombeiros 193 - SAMU 192.

A vida em primeiro lugar. Iniciando o FMDS.`;

Obs:
Caso o G1 (guia 1) entenda que outro caminho seguro (atalho - rota estabelecida) seja a melhor opcao, todos deverao segui-lo, conforme este plano estabelece.`;

const PT_MONTHS=["Janeiro","Fevereiro","Marco","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

function normLteImage(v){
  if(!v||typeof v!=="object")return null;
  const url=typeof v.url==="string"?v.url.trim():"";
  if(!url)return null;
  return{
    url,
    name:typeof v.name==="string"&&v.name.trim()?v.name.trim():"imagem",
    text:typeof v.text==="string"?v.text.slice(0,200):""
  };
}
function normLteImageSlots(slots,legacy){
  const arr=Array.from({length:LTE_IMAGE_SLOT_COUNT},()=>({url:"",name:"",text:""}));
  const src=Array.isArray(slots)?slots:[];
  src.slice(0,LTE_IMAGE_SLOT_COUNT).forEach((item,i)=>{
    const img=normLteImage(item);
    arr[i]=img?img:{url:"",name:typeof item?.name==="string"?item.name:"",text:typeof item?.text==="string"?item.text.slice(0,200):""};
  });
  const old=normLteImage(legacy);
  if(old&&!arr.some(x=>x.url))arr[0]=old;
  return arr;
}
function to2DPlanilha(p){
  if(Array.isArray(p)){
    const header=(p[0]||[]).map(x=>String(x??""));
    const rows=p.slice(1).map(r=>Array.isArray(r)?r.map(x=>String(x??"")):[]);
    return{headers:header,rows};
  }
  if(p&&typeof p==="object"){
    return{
      headers:Array.isArray(p.headers)?p.headers.map(x=>String(x??"")):[],
      rows:Array.isArray(p.rows)?p.rows.map(r=>Array.isArray(r)?r.map(x=>String(x??"")):[]):[]
    };
  }
  return{headers:[],rows:[]};
}
function migrateLtePlanilhaSchema(planilha){
  const p=to2DPlanilha(planilha);
  const headers=(p.headers||[]).map(h=>String(h||""));
  const rows=(p.rows||[]).map(r=>Array.isArray(r)?r.map(c=>normalizeSpreadsheetCell(c)) : []);
  if(!headers.length)return{headers,rows};
  const wanted=LTE_MODEL_BASE_HEADERS.map(h=>headers.findIndex(x=>normalizeHeaderKey(x)===normalizeHeaderKey(h)));
  const canMap=wanted.some(idx=>idx>-1);
  if(!canMap&&!headers.some(h=>/DATA DE EXECUCAO|HH PLANEJADO|DURACAO|NUM|TOLERANCIA MINIMA/i.test(h)))return{headers,rows};
  const statusIdx=headers.findIndex(h=>/status/i.test(h));
  const dueIdx=headers.findIndex(h=>/data de vencimento/i.test(h));
  const nextHeaders=[...LTE_MODEL_BASE_HEADERS];
  if(statusIdx>-1)nextHeaders.push("Status");
  if(dueIdx>-1)nextHeaders.push("Severidade");

function parseTabularText(txt){
  const src=String(txt||"").trim();
  if(!src)return[];
  const rows=src.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const header=rows[0]||"";
  const tabCount=(header.match(/\t/g)||[]).length;
  const semiCount=(header.match(/;/g)||[]).length;
  const commaCount=(header.match(/,/g)||[]).length;
  const delim=tabCount>0?"\t":(semiCount>=commaCount?";":",");
  return rows.map(r=>r.split(delim).map(c=>c.trim()));
}

function formatDateBr(d){

function normalizeSpreadsheetCell(v){
  if(v instanceof Date)return formatDateBr(v);
  const txt=String(v??"").trim();
  if(!txt)return "";
  const iso=txt.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:\s+\d{1,2}:\d{1,2}(?::\d{1,2})?)?$/);
  if(iso){
    const d=new Date(Number(iso[1]),Number(iso[2])-1,Number(iso[3]));
    return formatDateBr(d)||txt;
  }
  const slash=txt.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(slash){
    let a=Number(slash[1]),b=Number(slash[2]),y=Number(slash[3]);
    const shortYear=slash[3].length===2;
    if(y<100)y+=2000;
    const looksUs=shortYear||b>12;
    const day=looksUs?b:a;
    const month=looksUs?a:b;
    const d=new Date(y,month-1,day);
    if(d.getFullYear()===y&&d.getMonth()===month-1&&d.getDate()===day)return formatDateBr(d);
  }
  return txt;
}

async function loadScriptWithTimeout(src,timeoutMs=12000){
  return await new Promise((resolve,reject)=>{
    const sc=document.createElement("script");
    let done=false;
    const tm=setTimeout(()=>{
      if(done)return;
      done=true;
      sc.remove();
      reject(new Error("timeout"));
    },timeoutMs);
    sc.src=src;
    sc.async=true;
    sc.onload=()=>{
      if(done)return;
      done=true;
      clearTimeout(tm);
      resolve(true);
    };
    sc.onerror=()=>{
      if(done)return;
      done=true;
      clearTimeout(tm);
      sc.remove();
      reject(new Error("load_error"));
    };
    document.head.appendChild(sc);
  });
}
function ensureXlsxLib(){
  if(window.XLSX)return Promise.resolve(window.XLSX);

function parseBrDate(s){
  const txt=String(s||"").trim();
  const isoDateTime=txt.match(/^(\d{4})-(\d{1,2})-(\d{1,2})\s+\d{1,2}:\d{1,2}(:\d{1,2})?$/);
  if(isoDateTime){
    const y=Number(isoDateTime[1]),mo=Number(isoDateTime[2]),d=Number(isoDateTime[3]);
    const dt=new Date(y,mo-1,d);
    if(dt.getFullYear()===y&&dt.getMonth()===mo-1&&dt.getDate()===d)return dt;
  }
  const iso=txt.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(iso){
    const y=Number(iso[1]),mo=Number(iso[2]),d=Number(iso[3]);
    const dt=new Date(y,mo-1,d);
    if(dt.getFullYear()===y&&dt.getMonth()===mo-1&&dt.getDate()===d)return dt;
  }
  const m=txt.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(!m)return null;
  const d=Number(m[1]),mo=Number(m[2]),y=Number(m[3].length===2?("20"+m[3]):m[3]);
  if(!d||!mo||!y)return null;
  const dt=new Date(y,mo-1,d);
  if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return null;
  return dt;
}

  }
  return true;

function parseMmssToSecs(v){

  if(!Number.isFinite(mm)||!Number.isFinite(ss)||ss>59)return null;
  return mm*60+ss;
}

function hydrateEvacFields(baseFields){
  const cur=normalizeEvacFields(S.data["plano_evac"]);

function fsDocUrl(path){
  return `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(FB_CFG.projectId)}/databases/(default)/documents/${path}?key=${encodeURIComponent(FB_CFG.apiKey)}`;
}
function fromFsFields(fields){
  const out={};
  const src=(fields&&typeof fields==="object")?fields:{};
  Object.keys(src).forEach(k=>{
    const v=src[k]||{};
    if(typeof v.stringValue==="string")out[k]=v.stringValue;
    else if(typeof v.integerValue==="string")out[k]=v.integerValue;
    else if(typeof v.doubleValue==="number")out[k]=String(v.doubleValue);
    else if(typeof v.booleanValue==="boolean")out[k]=v.booleanValue?"true":"false";
  });
  return out;
}

  const n=normalizeEvacFields(obj);
  return{
    guias:{stringValue:n.guias},
    rotas:{stringValue:n.rotas},

    updatedAt:{timestampValue:new Date().toISOString()},

  };

async function fetchWeatherFromInmet(){
  S.weather.loading=true;S.weather.error="";re();
  const targets=[
    {place:"parauapebas",name:"Parauapebas"},
    {place:"parauapebas",name:"Serra dos Carajas - Corredor Norte"},
    {place:"parauapebas",name:"Mina de Ferro Carajas"}
  ];
  try{
    let usedProxy=false;
    const rows=[];
    for(const t of targets){
      let j=null, stale=false;
      try{
        const purl=`http://127.0.0.1:8090/weather?place=${encodeURIComponent(t.place)}`;
        const pr=await fetch(purl,{cache:"no-store"});
        if(pr.ok){
          const pj=await pr.json();
          if(pj&&pj.ok&&pj.data){j=pj.data;usedProxy=true;stale=!!pj.stale;}
        }
      }catch(_){}
      if(!j||!j.forecast)throw new Error("sem_dados_proxy");
      const root=j.forecast||{};
      const geo=Object.keys(root||{})[0];
      const byDate=(geo&&root[geo])?root[geo]:root;
      const days=Object.keys(byDate||{}).sort((a,b)=>{
        const pa=a.split("/").reverse().join("-");
        const pb=b.split("/").reverse().join("-");
        return pa.localeCompare(pb);
      });
      const d=days[0]&&byDate[days[0]]?byDate[days[0]]:{};
      const seq=["manha","tarde","noite"].map(k=>d[k]).filter(Boolean);
      const now=seq[0]||{}, nxt=seq[1]||seq[0]||{};
      rows.push({
        name:t.name,
        now:weatherSummary(now.resumo||now.tempo||now.ceu||"-")+(stale?" (cache)":""),
        temp:(now.temp_max&&now.temp_min)?`${now.temp_min}C a ${now.temp_max}C`:(now.temp||"-"),
        hum:now.umidade_max?`${now.umidade_min||"-"}% a ${now.umidade_max}%`:(now.umidade||"-"),
        wind:now.vento||now.int_vento||"-",
        next3h:weatherSummary(nxt.resumo||nxt.tempo||nxt.ceu||"-")
      });
    }
    S.weather.items=rows;
    S.weather.updatedAt=new Date().toLocaleTimeString("pt-BR");
    S.weather.source=usedProxy?"INMET / Proxy local":"INMET";
  }catch(_){
    S.weather.error="Falha ao consultar INMET em tempo real no navegador.";
  }finally{
    S.weather.loading=false;re();
  }
}

  const c=activeCompanies()[S.presIdx];if(!c)return;
  const lim=c.mins*60,left=lim-S.bSecs,pct=Math.min(100,S.bSecs/lim*100);
  const total=totalSecs();
  const td=document.getElementById("td"),tb=document.getElementById("tb"),totb=document.getElementById("totb"),totd=document.getElementById("totd");
  if(td){td.textContent=left>=0?fmt(left):"-"+fmt(-left);td.style.color=left<60?"var(--cr)":left<120?"var(--al)":"var(--gr)";}
  if(tb){tb.style.width=pct+"%";tb.style.background=pct>90?"var(--cr)":pct>70?"var(--al)":c.ac;}
  if(totb)totb.style.width=Math.min(100,S.tSecs/Math.max(total,1)*100)+"%";
  if(totd)totd.textContent=fmt(S.tSecs)+" / "+fmt(total);

    const diffEl=document.getElementById("lte-diff");
    const diffWrap=document.getElementById("lte-diff-wrap");

    if(reqEl)reqEl.textContent=S.lte?.tempoSolicitado||"--:--";

    if(diffEl){
      diffEl.textContent=reqSecs===null?"Formato invalido":fmtSignedSecs(S.bSecs-reqSecs);
    }
    if(diffWrap){
      diffWrap.style.color=reqSecs===null?"#B45309":((S.bSecs-reqSecs)>0?"#B91C1C":"#166534");
    }
  }
}

            <button class="lte-model-btn" onclick="lteMarkAllReviewed(${i})">Validar / Restaurar</button>
            <button class="lte-model-btn" onclick="addLteRow(${i})">+ Linha</button>
            <button class="lte-model-btn" onclick="addLteColumn(${i})">+ Coluna</button>
            <button class="lte-model-btn" onclick="removeLteTable(${i})">Remover Planilha</button>
            ${(()=>{const st=getLteSheetStats(row);return`<span class="lte-model-count">${st.total} linhas · ${st.reviewed} revisadas · ${st.pending} pendentes</span>`;})()}
          </div>
          ${columnPanel}
          <div class="lte-model-wrap">
            <table class="lte-model-table">
              <colgroup>${gridCols}</colgroup>
              <thead><tr>${gridHead}<th style="border:.5px solid #163556;padding:5px;background:#062540;width:32px"></th></tr></thead>
              <tbody>${gridBody||`<tr><td colspan="${visibleIndexes.length+1}" style="padding:10px;text-align:center;font-size:10px;color:#93C5FD;background:#081a2d">Sem linhas na planilha.</td></tr>`}</tbody>
            </table>
          </div>
        </div>
      </div>`:""}
      ${meta.hasImage?`<div style="margin-bottom:6px">
        <div style="font-size:9px;color:${c.ac};text-transform:uppercase;margin-bottom:3px">Imagem</div>
        <div class="lte-image-grid">${imageSlots}</div>
      </div>`:""}
      <div>
        <div style="font-size:9px;color:${c.ac};text-transform:uppercase;margin-bottom:3px">Texto livre</div>
        <textarea id="lte_txt_${i}" rows="3" oninput="setLteTextoLivre(${i},this.value)" placeholder="Digite observacoes complementares" style="width:100%;background:var(--bg);border:1px solid var(--cc);border-radius:7px;padding:.45rem .65rem;color:var(--gr);font-size:12px;line-height:1.45;resize:vertical">${escHtml(row.textoLivre||"")}</textarea>
      </div>
      </div>
    </div>`;
  }).join("");
  return`<div>
    ${wsHeader(c)}
    ${v1}
    ${cards}
    <button onclick="saveWS()" style="width:100%;padding:.55rem;border-radius:8px;background:var(--gv);border:none;color:#fff;font-weight:500;font-size:13px;cursor:pointer">Salvar</button>
  </div>`;
}

//  PORTAL 
function renderPortal(){
  const f=fCount();
  const weatherCards=S.weather.items.map(w=>`<div style="background:var(--wh);border:.5px solid var(--cc);border-radius:8px;padding:.6rem .7rem">
    <div style="font-size:12px;font-weight:700;color:var(--gr);margin-bottom:4px">${w.name}</div>
    <div style="font-size:15px;font-weight:700;color:var(--gv)">${w.now}</div>
    <div style="font-size:12px;color:var(--cm);margin-top:2px">Temp: ${w.temp} | Umidade: ${w.hum}</div>
    <div style="font-size:12px;color:var(--cm)">Vento: ${w.wind} | Prox. 3h: ${w.next3h}</div>
  </div>`).join("");
  const cards=COMPANIES.map(c=>{
    const ok=filled(c.id);
    const on=S.enabled[c.id];
    return`<div onclick="openWS('${c.id}')" style="background:var(--wh);border:.5px solid ${ok?c.ac+"66":"var(--cc)"};border-left:3px solid ${c.ac};border-radius:8px;padding:.65rem .85rem;cursor:pointer;opacity:${on?1:.55}">

        <div style="width:24px;height:24px;border-radius:50%;background:${c.ac}18;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:500;color:${c.ac}">${c.init}</div>
        <button onclick="event.stopPropagation();toggleGuide('${c.id}')" style="font-size:9px;padding:1px 6px;border-radius:20px;background:${on?c.ac+"15":"var(--bg)"};border:.5px solid ${on?c.ac+"44":"var(--cc)"};color:${on?c.ac:"var(--cm)"};font-weight:500;cursor:pointer">${on?(ok?"OK pronto":"ligada"):"ausente"}</button>
      </div>
      <div style="font-size:12px;font-weight:500;color:var(--gr)">${c.name}</div>
      <div style="font-size:10px;color:var(--cm);margin-top:1px">${c.sub}</div>
      <div style="font-size:9px;color:#9CA3AF;margin-top:3px">${c.mins} min</div>
    </div>`;
  }).join("");
  return`<div>
    <div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:.65rem">
      <button onclick="startFMDS()" class="top-btn" style="background:var(--gv);border-color:var(--gv);color:#fff;padding:5px 12px;border-radius:8px;font-weight:600">Iniciar FMDS ></button>
      <div class="theme-dual" title="Tema dual">
        <button onclick="setTheme('day')" class="${S.theme==='day'?'active':''}">Dia</button>
        <button onclick="setTheme('night')" class="${S.theme==='night'?'active':''}">Noite</button>
      </div>
      ${S.role==="admin"
        ?`<button onclick="resetLocalCache()" class="top-btn" style="border-radius:20px;border-color:#FECACA;color:#B91C1C;background:#FFF1F2">Reinicializar cache local</button>`
        :""}
    </div>
    <div style="background:linear-gradient(90deg,var(--gv),var(--bt));padding:.75rem 1rem;border-radius:8px;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-size:10px;color:rgba(255,255,255,.65);letter-spacing:.06em;text-transform:uppercase">Sistema de Apresentacao</div>
        <div style="font-size:15px;font-weight:500;color:#fff">FMDS - Infratech Carajas</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:10px;color:rgba(255,255,255,.6)">${f} de ${activeCompanies().length} ativas prontas</div>
        <div style="font-size:13px;font-weight:500;color:#fff">${fmt(totalSecs())} total</div>
      </div>
    </div>
    <div style="background:var(--bg);border:.5px solid var(--cc);border-radius:8px;padding:.7rem;margin-bottom:1rem">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:.45rem">
        <div style="font-size:15px;font-weight:700;color:var(--gr)">Clima e Tempo Operacional</div>
        <div style="display:flex;align-items:center;gap:8px">
          <button onclick="toggleWeatherPanel()" class="top-btn" style="padding:3px 8px">${S.weather.collapsed?"Mostrar":"Recolher"}</button>
          <div style="font-size:11px;color:var(--cm)">${S.weather.loading?"Atualizando...":(S.weather.updatedAt?`Atualizado: ${S.weather.updatedAt}`:"Sem atualizacao")}</div>
        </div>
      </div>
      ${S.weather.collapsed?"":`
      ${S.weather.error?`<div style="font-size:12px;color:#B45309;background:#FFFBEB;border:.5px solid #FDE68A;border-radius:6px;padding:.45rem .6rem;margin-bottom:.5rem">${S.weather.error}</div>`:""}
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">${weatherCards}</div>
      <div style="font-size:11px;color:var(--cm);margin-top:.45rem">Fonte: ${S.weather.source} (governo federal). Faixa operacional: agora + tendencia 3h.</div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:1rem">${cards}</div>

}

//  PRESENTATION 
function renderPresent(){
  const actives=activeCompanies();
  const done=S.presIdx>=actives.length;
  if(done)return`<div style="text-align:center;padding:2.5rem 0">
    <div style="font-size:32px;color:var(--gv);margin-bottom:8px">OK</div>
    <div style="font-size:16px;font-weight:500;color:var(--gr);margin-bottom:4px">FMDS encerrado</div>
    <div style="font-size:12px;color:var(--cm);margin-bottom:1.25rem">Duracao: ${fmt(S.tSecs)} / ${fmt(totalSecs())}</div>
    <button onclick="goHome()" style="padding:.5rem 1.5rem;border-radius:8px;background:var(--gv);border:none;color:#fff;font-weight:500;font-size:13px;cursor:pointer">Inicio</button>
  </div>`;

  const c=actives[S.presIdx];
  const isEvac=c.id==="plano_evac";
  const isVps=c.id==="vale_vps";
  const isLte=c.id==="sonda_lte";
  const flds=c.fields.filter(f=>S.data[c.id][f.k]?.trim());
  const evacBlock=isEvac?`
    <div style="background:#F0F7FF;border:.5px solid #BFDBFE;border-radius:7px;padding:.6rem .75rem;margin-bottom:.5rem">
      <div style="font-size:9px;font-weight:500;color:var(--bt);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.35rem">Inicio FMDS - Premissas de Seguranca</div>
      <div style="font-size:11px;color:var(--gr);line-height:1.6;white-space:pre-wrap;max-height:110px;overflow-y:auto">${S.evacScript}</div>
    </div>
    <div style="display:flex;gap:5px;margin-bottom:.5rem">
      ${S.evacImages.map((img,i)=>img
        ?`<div style="flex:1;cursor:pointer" onclick="openModal('${img.url}')">
            <img src="${img.url}" style="width:100%;height:48px;object-fit:cover;border-radius:6px;border:.5px solid var(--cc)"/>
            <div style="font-size:8px;color:var(--bt);text-align:center;margin-top:2px">Imagem ${i+1} - clique para ampliar</div>
          </div>`
        :`<div style="flex:1;height:48px;background:var(--bg);border:.5px dashed var(--cc);border-radius:6px;display:flex;align-items:center;justify-content:center">
            <span style="font-size:8px;color:#C4C9D4">Img ${i+1}</span>
          </div>`
      ).join("")}
    </div>`:"";
  const vpsHTML=isVps?`<div style="max-height:260px;overflow-y:auto;padding-right:2px">
    ${normalizeVpsBlocks(S.vps.blocks).map((b,i)=>`<div style="background:var(--bg);border-radius:6px;padding:.4rem .65rem;border-left:2px solid ${c.ac}55;margin-bottom:4px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap">
        <div style="font-size:9px;font-weight:500;color:${c.ac};text-transform:uppercase;letter-spacing:.05em">${b.order}. ${b.title}</div>
        ${[8,9,11].includes(i)?`<div style="font-size:8px;padding:1px 6px;border-radius:999px;background:#EFF6FF;border:.5px solid #BFDBFE;color:#1D4ED8">${currentMonthLabel()}</div>`:""}
      </div>
      ${b.text?.trim()?`<div style="font-size:10px;color:var(--gr);line-height:1.35;white-space:pre-wrap;margin-top:2px">${escHtml(b.text).slice(0,240)}</div>`:`<div style="font-size:10px;color:var(--cm)">Sem texto</div>`}
    </div>`).join("")}
  </div>`:"";
  const lteHTML=isLte?(()=>{
    const l=normalizeLteState(S.lte);
    const reqSecs=parseMmssToSecs(l.tempoSolicitado);
    const diff=(reqSecs===null)?null:(S.bSecs-reqSecs);
    const effective=getEffectiveLteViewsForPresentation();
    const d0Active=!!(l.views[3]&&l.views[3].enabled&&lteViewHasContent(l.views[3]));
    const metric=`<div style="background:linear-gradient(105deg,#0B6FB8,#005E36);border:.5px solid #0EA5E9;border-radius:8px;padding:.5rem .65rem;margin-bottom:.45rem;box-shadow:0 6px 16px rgba(2,132,199,.18)">
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <div style="font-size:10px;color:#DBEAFE"><b>Tempo solicitado:</b> <span id="lte-req">${escHtml(l.tempoSolicitado||"--:--")}</span></div>
        <div style="font-size:10px;color:#F8FAFC"><b>Tempo real:</b> <span id="lte-real">${fmt(S.bSecs)}</span></div>
        <div id="lte-diff-wrap" style="font-size:10px;color:${diff===null?'#FDE68A':(diff>0?'#FECACA':'#BBF7D0')}"><b>Diferenca:</b> <span id="lte-diff">${diff===null?'Formato invalido':fmtSignedSecs(diff)}</span></div>
      </div>
    </div>`;
    const rows=effective.map((row)=>{
      const i=l.views.findIndex(x=>x.id===row.id);
      const m=LTE_VIEWS_META[i];
      const imgs=normLteImageSlots(row.imagens,row.imagem).filter(x=>x.url||x.text);
      const img=imgs.length?`<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin-top:4px">${imgs.map(x=>`
        <div style="border:.5px solid var(--cc);border-radius:6px;padding:4px;background:var(--wh)">
          ${x.url?`<img src="${x.url}" onclick="openModal('${x.url}')" style="width:100%;height:52px;object-fit:cover;border-radius:5px;cursor:pointer"/>`:""}
          ${x.text?`<div style="font-size:9px;color:var(--gr);line-height:1.25;margin-top:3px">${escHtml(x.text)}</div>`:""}
        </div>`).join("")}</div>`:"";
      const plan=lteVisiblePlan(row);
      const tab=(Array.isArray(plan.rows)&&plan.rows.length)?`<div style="margin-top:4px">${renderGridPreview(plan)}</div>`:"";
      return`<div style="background:var(--bg);border-radius:6px;padding:.45rem .65rem;border-left:2px solid ${c.ac}88;margin-bottom:4px">
        <div style="font-size:9px;font-weight:600;color:${c.ac};text-transform:uppercase;letter-spacing:.05em">${m.title}</div>
        ${(!m.hasSheet&&row.observacoes?.trim())?`<div style="font-size:10px;color:var(--gr);white-space:pre-wrap"><b>${m.obsLabel}:</b> ${escHtml(row.observacoes)}</div>`:""}
        ${row.textoLivre?.trim()?`<div style="font-size:10px;color:var(--gr);white-space:pre-wrap">${escHtml(row.textoLivre)}</div>`:""}
        ${tab}${img}
      </div>`;
    }).join("");
    const badge=d0Active?`<div style="font-size:9px;color:#92400E;background:#FFFBEB;border:.5px solid #FDE68A;border-radius:6px;padding:.3rem .5rem;margin-bottom:.35rem">D0 ativo: views D-3, D-2 e D-1 ocultadas na apresentacao.</div>`:"";
    return`<div style="max-height:260px;overflow-y:auto;padding-right:2px">${metric}${badge}${rows||`<div style="font-size:10px;color:var(--cm);font-style:italic">Nenhuma view LTE ligada para exibicao.</div>`}</div>`;
  })():"";
  const dataHTML=isVps?vpsHTML:(isLte?lteHTML:(flds.length?flds.map(f=>`
    <div style="background:var(--bg);border-radius:6px;padding:.4rem .65rem;border-left:2px solid ${c.ac}55;margin-bottom:4px">
      <div style="font-size:9px;font-weight:500;color:${c.ac};text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px">${f.l}</div>
      <div style="font-size:12px;color:var(--gr);line-height:1.5;white-space:pre-wrap">${S.data[c.id][f.k]}</div>
    </div>`).join(""):(isEvac?"":(`<div style="font-size:11px;color:var(--cm);font-style:italic">Script padrao do agente.</div>`))));
  const imgH=(isLte||isVps)?"":(S.imgs[c.id]?.length?`<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:5px">${S.imgs[c.id].map((img,i)=>`<img src="${img.url}" onclick="openModal('${img.url}')" style="height:48px;border-radius:6px;border:.5px solid var(--cc);cursor:pointer"/>`).join("")}</div>`:"");
  const ovH=S.overflow?`<div style="background:#FFFBEB;border:.5px solid var(--al);border-radius:8px;padding:.65rem;margin-bottom:.65rem">
    <div style="font-size:11px;font-weight:500;color:#92400E;margin-bottom:2px">Tempo Overflow Session</div>
    <div style="font-size:10px;color:#B45309">Tempo excedido. Sugestao: +10 min. Registre na ata.</div>
  </div>`:"";

  return`<div>
    <div style="background:linear-gradient(90deg,var(--gv),var(--bt));padding:.55rem .85rem;border-radius:8px;margin-bottom:.7rem;display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;align-items:center;gap:5px">
        <button onclick="goHome()" style="padding:3px 8px;border-radius:5px;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:10px;cursor:pointer">Inicio</button>
        <button onclick="prevBlock()" ${S.presIdx===0?"disabled":""} style="padding:3px 8px;border-radius:5px;background:${S.presIdx===0?"transparent":"rgba(255,255,255,.15)"};border:none;color:${S.presIdx===0?"rgba(255,255,255,.3)":"#fff"};font-size:10px;cursor:${S.presIdx===0?"default":"pointer"}">< Voltar</button>
      </div>
      <div id="totd" style="font-size:10px;color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums">00:00 / ${fmt(totalSecs())}</div>
    </div>
    <div style="height:3px;background:var(--cc);border-radius:2px;overflow:hidden;margin-bottom:.7rem">
      <div id="totb" style="height:3px;background:var(--gv);border-radius:2px;width:0%;transition:width .5s"></div>
    </div>
    <div style="background:var(--wh);border:.5px solid var(--cc);border-left:3px solid ${c.ac};border-radius:8px;padding:.85rem;margin-bottom:.6rem">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:.6rem">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:32px;height:32px;border-radius:50%;background:${c.ac}18;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:${c.ac}">${c.init}</div>
          <div><div style="font-size:14px;font-weight:500;color:var(--gr)">${c.name}</div><div style="font-size:10px;color:var(--cm)">${c.sub}</div></div>
        </div>
        <div style="text-align:right">
          <div id="td" style="font-size:22px;font-weight:500;color:var(--gr);font-variant-numeric:tabular-nums">--:--</div>
          <div style="font-size:9px;color:var(--cm)">restante</div>
        </div>
      </div>
      <div style="height:3px;background:var(--cc);border-radius:2px;overflow:hidden;margin-bottom:.6rem">
        <div id="tb" style="height:3px;border-radius:2px;background:${c.ac};width:0%;transition:width .5s"></div>
      </div>
      <div style="background:var(--bg);border:.5px solid var(--cc);border-radius:6px;padding:.45rem .65rem;margin-bottom:.6rem;display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:6px">
          <div style="width:6px;height:6px;border-radius:50%;background:${S.manual?"var(--al)":"var(--bt)"};animation:pulse 1.4s infinite"></div>
          <div style="font-size:10px;color:${S.manual?"#92400E":"var(--bt)"};font-weight:500">${S.manual?"Apresentador conduz":"Agente virtual ativo"}</div>
          <div id="sp-wv" class="wv" style="display:${S.speaking?"inline-flex":"none"}"><span></span><span></span><span></span><span></span><span></span></div>
        </div>
        <button id="sp-btn" onclick="toggleSpeak()" style="padding:3px 10px;border-radius:20px;background:${S.speaking?"var(--bt)":"transparent"};border:1px solid var(--bt);color:${S.speaking?"#fff":"var(--bt)"};font-size:10px;cursor:pointer;font-weight:500">${S.speaking?"Parar":"Narrador Virtual"}</button>
      </div>
      ${evacBlock}${dataHTML}${imgH}
    </div>
    ${ovH}
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button onclick="toggleRun()" style="padding:.38rem .85rem;border-radius:7px;background:transparent;border:1px solid var(--cc);color:var(--cm);font-size:11px;cursor:pointer">${S.running?"Pausar Pausar":"Retomar Retomar"}</button>
      <button onclick="toggleManual()" style="padding:.38rem .85rem;border-radius:7px;background:transparent;border:1px solid ${S.manual?"var(--al)":"var(--cc)"};color:${S.manual?"#92400E":"var(--cm)"};font-size:11px;cursor:pointer">${S.manual?"< Agente":"Assumir"}</button>
      <button onclick="toggleOverflow()" style="padding:.38rem .85rem;border-radius:7px;background:transparent;border:1px solid ${S.overflow?"var(--al)":"var(--cc)"};color:${S.overflow?"#92400E":"var(--cm)"};font-size:11px;cursor:pointer">Overflow</button>
      <button onclick="nextBlock()" style="flex:1;padding:.38rem .85rem;border-radius:7px;background:var(--gv);border:none;color:#fff;font-weight:500;font-size:11px;cursor:pointer">Proximo ></button>
    </div>
  </div>`;
}

//  MODAL 
function renderModal(){
  if(!S.modalImg)return"";
  const hasNav=S.modalList.length>1;
  return`<div onclick="closeModal()" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.88);z-index:9999;display:flex;align-items:center;justify-content:center;padding:.35rem">
    <div onclick="event.stopPropagation()" style="width:90vw;height:90vh;max-width:90vw;max-height:90vh;background:var(--wh);border-radius:10px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);display:flex;flex-direction:column">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:.5rem .85rem;background:var(--gv)">
        <span style="font-size:11px;color:rgba(255,255,255,.8)">Exibicao - Plano de evacuacao</span>
        <div style="display:flex;align-items:center;gap:8px">
          ${hasNav?`<span style="font-size:11px;color:rgba(255,255,255,.8)">${S.modalIdx+1}/${S.modalList.length}</span>`:""}
          <button onclick="closeModal()" style="background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:4px;padding:3px 9px;font-size:12px;cursor:pointer;font-weight:500">X Fechar</button>
        </div>
      </div>
      <div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:.2rem;position:relative">
        ${hasNav?`<button onclick="prevModalImage()" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:none;background:rgba(0,107,63,.75);color:#fff;font-size:18px;cursor:pointer;z-index:2"><</button>`:""}
        <img src="${S.modalImg}" style="max-width:100%;max-height:100%;width:auto;height:auto;display:block;object-fit:contain"/>
        ${hasNav?`<button onclick="nextModalImage()" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:none;background:rgba(0,107,63,.75);color:#fff;font-size:18px;cursor:pointer;z-index:2">></button>`:""}
      </div>
    </div>
  </div>`;
}

//  MAIN RENDER 
function renderMain(){
  if(S.view==="portal")return renderPortal();
  if(S.view==="workspace"){
    if(S.selId==="plano_evac")return renderEvacWS();
    if(S.selId==="vale_vps")return renderVpsWS();
    if(S.selId==="sonda_lte")return renderSondaLteWS();
    return renderGenericWS();
  }
  if(S.view==="present")return renderPresent();
  return"";
}

function re(){
  const prevMain=document.getElementById("main");
  const prevScroll=prevMain?prevMain.scrollTop:0;
  const ae=document.activeElement;
  const focusId=(ae&&ae.id)?ae.id:"";
  const selStart=(ae&&typeof ae.selectionStart==="number")?ae.selectionStart:null;
  const selEnd=(ae&&typeof ae.selectionEnd==="number")?ae.selectionEnd:null;
  document.body.classList.toggle("night",S.theme==="night");
  const app=document.getElementById("app");
  app.innerHTML=renderSidebar()
    +`<div id="main" class="fade" style="flex:1;padding:.85rem;overflow-y:auto;background:var(--bg)">${renderMain()}</div>`
    +renderModal();
  const nextMain=document.getElementById("main");
  if(nextMain)nextMain.scrollTop=prevScroll;
  if(focusId){
    const target=document.getElementById(focusId);
    if(target){
      target.focus({preventScroll:true});
      if(selStart!==null&&selEnd!==null&&typeof target.setSelectionRange==="function"){
        try{target.setSelectionRange(selStart,selEnd);}catch(_){}
      }
    }
  }
  attachEv();
  if(S.view==="present"&&S.running)updTimer();
  if(S.view==="present")updSUI();
}

function attachEv(){
  if(S.view==="workspace"){
    if(S.selId==="plano_evac"){
      const sc=document.getElementById("evac-script");
      if(sc)sc.addEventListener("input",e=>{S.evacScript=e.target.value;saveEvacScript();saveAppState();});
      COMPANIES[0].fields.forEach(f=>{const el=document.getElementById("f_"+f.k);if(el)el.addEventListener("input",e=>{S.data["plano_evac"][f.k]=e.target.value;saveAppState();});});
    } else {
      const c=COMPANIES.find(x=>x.id===S.selId);
      if(c){
        c.fields.forEach(f=>{const el=document.getElementById("f_"+f.k);if(el)el.addEventListener("input",e=>{S.data[c.id][f.k]=e.target.value;saveAppState();});});
      }
    }
  }
  clearInterval(cInt);
  cInt=setInterval(()=>{
    const d=new Date();
    const t=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0");
    const el=document.getElementById("sb-clock");
    if(el)el.textContent=t;
  },1000);
}

function addLteColumn(i){

  saveLteState();
  re();

function setLteHeader(i,cIdx,v){
  const row=ensureLteView(i);
  upsertLteStatusAndDueColumns(row);
  const old=String(row.planilha.headers[cIdx]||"");
  if(/status|severidade|data de vencimento/i.test(old))return;
  row.planilha.headers[cIdx]=String(v||"");
  upsertLteStatusAndDueColumns(row);
  saveLteState();
}
function setLteCell(i,rIdx,cIdx,v){
  const row=ensureLteView(i);
  upsertLteStatusAndDueColumns(row);
  const h=String(row.planilha.headers[cIdx]||"").toLowerCase();
  if(h.includes("data de vencimento")||h.includes("severidade"))return;
  if(!row.planilha.rows[rIdx])return;
  row.planilha.rows[rIdx][cIdx]=h.includes("status")?normalizeStatus(v):String(v||"");
  upsertLteStatusAndDueColumns(row);
  saveLteState();
}

function resetLocalCache(){
  if(S.role!=="admin")return;
  const ok=confirm("Reinicializar cache local desta aplicacao? Esta acao limpa bases, edicoes e imagens salvas no navegador.");
  if(!ok)return;
  const evacSlotKeys=[0,1,2].map(i=>EVAC_IMG_SLOT_PREFIX+i);
  const lteImgKeys=[
    ...LTE_VIEWS_META.map((_,i)=>LTE_IMG_SLOT_PREFIX+i),
    ...LTE_VIEWS_META.flatMap((_,i)=>Array.from({length:LTE_IMAGE_SLOT_COUNT},(__,j)=>`${LTE_IMG_SLOT_PREFIX}${i}_${j}`))
  ];
  [
    EVAC_IMG_KEY,EVAC_SCRIPT_KEY,EVAC_SCRIPT_BASE_KEY,EVAC_FIELDS_BASE_KEY,LTE_STATE_KEY,APP_STATE_KEY,...evacSlotKeys,...lteImgKeys
  ].forEach(k=>{try{localStorage.removeItem(k);}catch(_){}});
  idbDelete(EVAC_IMG_KEY).catch(()=>{});
  evacSlotKeys.forEach(k=>idbDelete(k).catch(()=>{}));
  lteImgKeys.forEach(k=>idbDelete(k).catch(()=>{}));
  S.enabled=Object.fromEntries(COMPANIES.map(c=>[c.id,true]));
  S.data=Object.fromEntries(COMPANIES.map(c=>[c.id,Object.fromEntries(c.fields.map(f=>[f.k,""]))]));
  S.data["plano_evac"]={...EVAC_DEFAULT_FIELDS,...S.data["plano_evac"]};
  S.imgs=Object.fromEntries(COMPANIES.map(c=>[c.id,[]]));
  S.evacImages=[null,null,null];
  S.evacScript=SCRIPT_SEG;
  S.vps={blocks:buildDefaultVpsBlocks()};
  S.lte=buildDefaultLteState();
  S.theme="day";
  S.view="portal";
  S.selId=null;
  S.presIdx=0;S.bSecs=0;S.tSecs=0;S.running=false;S.manual=false;S.overflow=false;S.speaking=false;
  saveAppState();
  saveEvacScript();
  re();
}
