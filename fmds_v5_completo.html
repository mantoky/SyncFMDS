<script>
const SCRIPT_SEG=`Sejam bem-vindos ao FMDS Infratech, Carajás - Corredor Norte.

Antes de iniciarmos, atenção às premissas de segurança:

Saídas de emergência
Faça a validação das condições de fluxo das saídas e abertura das portas de emergência.
Em caso de emergência nas operações da Vale, acione o CECOM: 0800 2850 193.

Use o rádio em emergências
Pressione o botão vermelho por 3 segundos, aguarde o retorno do atendente dos Bombeiros. Informe a localização, tipo de ocorrência e número de pessoas envolvidas, direta ou indiretamente. Seja claro e objetivo com o relato.

Guias de evacuação
G1 - Guia de frente - abre o caminho e conduz o grupo ao Ponto de Encontro N78.
G2 - Guia de retaguarda - será o último a sair, ele se certificará de que ninguém ficou para trás!

Em caso de evacuação
Siga o seguinte trajeto definido para Rota de Fuga:
- G1 conduzirá a evacuação, seguindo pela porta de emergência mais próxima, e, em fila indiana, todos deverão seguir pela área externa do prédio Infratech. Passando pelo prédio de Sondagem, haverá uma curva suave à esquerda, contornando o início das rampas dos ônibus. Manter a direção em linha reta, exceto quando houver obstruções por pessoas, materiais, bloqueio etc. Ao fim deste corredor, vocês verão a saída da área coberta, com curva suave à esquerda, onde serão direcionados à Praça da Bandeira. Seguindo adiante, existe uma escada dividida por um corrimão; todos deverão utilizá-la ordenadamente, acompanhados pelo G2, direcionando-se ao PONTO DE ENCONTRO PE N78, logo após o estacionamento do CCO, ao lado do Heliponto.

Observação
Caso o G1, guia 1, entenda que um outro caminho seguro, atalho ou rota estabelecida, seja a melhor opção, todos deverão segui-lo, conforme este plano estabelece.

Lembrem-se: não improvisem caminhos, mantenham-se calmos!

A vida em primeiro lugar. Iniciando o FMDS.
Contatos: CECOM 0800 2850 193 - Bombeiros 193 - SAMU 192.`;
const EVAC_ROTAS_BASE=`G1 conduzira a evacuacao, seguindo pela porta de emergencia mais proxima, em fila indiana. Todos deverao seguir pela area externa do predio Infratech, passando pelo predio de Sondagem. Havera uma curva suave a esquerda, contornando o inicio das rampas de onibus. Manter a direcao em linha reta (exceto quando houver obstrucoes por pessoas, materiais, bloqueio etc.). Ao fim deste corredor, havera uma saida da area coberta (curva suave a esquerda), onde direcionara todos a Praca da Bandeira. Seguindo adiante, havera uma escada dividida por um corrimao; todos deverao, ordenadamente, direcionar-se ao PONTO DE ENCONTRO (PE N78), logo apos o estacionamento do CCO, ao lado do Heliponto.

Obs:
Caso o G1 (guia 1) entenda que outro caminho seguro (atalho - rota estabelecida) seja a melhor opcao, todos deverao segui-lo, conforme este plano estabelece.`;
const EVAC_DEFAULT_FIELDS={
  guias:"",
  rotas:EVAC_ROTAS_BASE,
  ponto:"",
  obs:""
};

const COMPANIES=[
  {id:"plano_evac",name:"Plano de Evacuacao",sub:"Premissas - Rotas - Emergencia",ac:"#006B3F",mins:6,mode:"agent",init:"PE",script:SCRIPT_SEG,
   fields:[{k:"guias",l:"Guias de evacuacao",p:"G1 - G2 - substitutos..."},{k:"rotas",l:"Rotas e saidas",p:"Saidas, trajetos e restricoes..."},{k:"ponto",l:"Ponto de encontro",p:"Local, referencia, observacoes..."},{k:"obs",l:"Observacoes de seguranca",p:"Alertas, bloqueios, mudancas..."}]},
  {id:"vale_vps",name:"VPS Vale",sub:"Abertura - Seguranca - Agenda",ac:"#2F80ED",mins:8,mode:"human",init:"VV",script:SCRIPT_SEG,

  if(old&&!arr.some(x=>x.url))arr[0]=old;

function to2DPlanilha(p){
  if(Array.isArray(p)){
    const header=(p[0]||[]).map(x=>String(x??""));
    const rows=p.slice(1).map(r=>Array.isArray(r)?r.map(x=>String(x??"")):[]);
    return{headers:header,rows};
  }
  if(p&&typeof p==="object"){
    return{
      headers:Array.isArray(p.headers)?p.headers.map(x=>String(x??"")):[],
      rows:Array.isArray(p.rows)?p.rows.map(r=>Array.isArray(r)?r.map(x=>String(x??"")):[]):[]
    };
  }
  return{headers:[],rows:[]};
}
function migrateLtePlanilhaSchema(planilha){
  const p=to2DPlanilha(planilha);
  const headers=(p.headers||[]).map(h=>String(h||""));
  const rows=(p.rows||[]).map(r=>Array.isArray(r)?r.map(c=>normalizeSpreadsheetCell(c)) : []);
  if(!headers.length)return{headers,rows};
  const aliases={
    "TEXTO BREVE DA OPERACAO":["TEXTO BREVE DA OPERACAO","TEXTO BREVE","DESCRICAO"],
    "TRAB":["TRAB","HH PLANEJADO","HH"],
    "TOLERANCIA MAXIMA":["TOLERANCIA MAXIMA","TOLERANCIA MAX","DATA DE VENCIMENTO","SEVERIDADE"]
  };
  const findModelIdx=h=>{
    const keys=(aliases[h]||[h]).map(normalizeHeaderKey);
    return headers.findIndex(x=>keys.includes(normalizeHeaderKey(x)));
  };
  const wanted=LTE_MODEL_BASE_HEADERS.map(findModelIdx);
  const canMap=wanted.some(idx=>idx>-1);
  if(!canMap&&!headers.some(h=>/DATA DE EXECUCAO|HH PLANEJADO|DURACAO|NUM|TOLERANCIA MINIMA/i.test(h)))return{headers,rows};
  const statusIdx=headers.findIndex(h=>/status/i.test(h));
  const dueIdx=headers.findIndex(h=>/data de vencimento/i.test(h));
  const nextHeaders=[...LTE_MODEL_BASE_HEADERS];
  if(statusIdx>-1)nextHeaders.push("Status");
  if(dueIdx>-1)nextHeaders.push("Severidade");
  const nextRows=rows.map(r=>{
    const out=wanted.map((idx,pos)=>idx>-1?normalizeSpreadsheetCell(r[idx]||""):"");
    if(statusIdx>-1)out.push(normalizeStatus(r[statusIdx]||""));
    if(dueIdx>-1)out.push(String(r[dueIdx]||""));
    return out;
  });
  return{headers:nextHeaders,rows:nextRows};
}
function normalizeLteState(raw){
  const def=buildDefaultLteState();
  const src=(raw&&typeof raw==="object")?raw:{};
  const tempo=typeof src.tempoSolicitado==="string"&&src.tempoSolicitado.trim()?src.tempoSolicitado.trim():def.tempoSolicitado;
  const statusOptions=Array.isArray(src.statusOptions)&&src.statusOptions.length
    ?[...new Set(src.statusOptions.map(s=>normalizeStatus(s)).filter(Boolean))]
    :[...DEFAULT_LTE_STATUS_OPTIONS];
  const viewsSrc=Array.isArray(src.views)?src.views:[];
  const views=def.views.map((d,i)=>{
    const cur=(viewsSrc[i]&&typeof viewsSrc[i]==="object")?viewsSrc[i]:{};
    const hiddenColumns=(cur.hiddenColumns&&typeof cur.hiddenColumns==="object")?{...LTE_DEFAULT_HIDDEN_COLUMNS,...cur.hiddenColumns}:{...LTE_DEFAULT_HIDDEN_COLUMNS};
    return{
      id:d.id,
      enabled:cur.enabled===false?false:true,
      observacoes:typeof cur.observacoes==="string"?cur.observacoes:"",
      textoLivre:typeof cur.textoLivre==="string"?cur.textoLivre:"",
      planilha:migrateLtePlanilhaSchema(cur.planilha),
      filtros:{
        dataProgramada:String(cur?.filtros?.dataProgramada||""),
        localInstalacao:String(cur?.filtros?.localInstalacao||""),
        toleranciaMax:String(cur?.filtros?.toleranciaMax||""),
        dataVencimento:String(cur?.filtros?.dataVencimento||""),
        status:String(cur?.filtros?.status||"")
      },
      hiddenColumns,
      columnFilterOpen:!!cur.columnFilterOpen,
      imagens:normLteImageSlots(cur.imagens,cur.imagem)
    };
  });
  // D0 (indice 3) sempre ativo
  if(views[3])views[3].enabled=true;
  return{tempoSolicitado:tempo,statusOptions,views};
}
function normalizeVpsBlocks(raw){

    };

}

async function readImageOptimized(file){
  if(!file)throw new Error("image_missing");
  const asDataUrl=()=>{
    return new Promise((resolve,reject)=>{
      const fr=new FileReader();
      fr.onload=e=>resolve(e.target.result);
      fr.onerror=()=>reject(new Error("read_file_error"));
      fr.readAsDataURL(file);
    });
  };
  if(!String(file.type||"").startsWith("image/"))return await asDataUrl();
  const raw=await asDataUrl();
  const img=await new Promise((resolve,reject)=>{
    const i=new Image();
    i.onload=()=>resolve(i);
    i.onerror=()=>reject(new Error("load_image_error"));
    i.src=raw;
  });
  const maxEdge=2200;
  const ratio=Math.min(1,maxEdge/Math.max(img.width||1,img.height||1));
  const w=Math.max(1,Math.round((img.width||1)*ratio));
  const h=Math.max(1,Math.round((img.height||1)*ratio));
  const cv=document.createElement("canvas");
  cv.width=w;cv.height=h;
  const ctx=cv.getContext("2d");
  if(!ctx)return raw;
  ctx.drawImage(img,0,0,w,h);
  return cv.toDataURL("image/jpeg",0.88);
}
function parseTabularText(txt){
  const src=String(txt||"").trim();
  if(!src)return[];
  const rows=src.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const header=rows[0]||"";
  const tabCount=(header.match(/\t/g)||[]).length;
  const semiCount=(header.match(/;/g)||[]).length;
  const commaCount=(header.match(/,/g)||[]).length;
  const delim=tabCount>0?"\t":(semiCount>=commaCount?";":",");
  return rows.map(r=>r.split(delim).map(c=>c.trim()));
}
function pad2(n){return String(n).padStart(2,"0");}
function formatDateBr(d){
  if(!(d instanceof Date)||Number.isNaN(d.getTime()))return "";
  return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()}`;
}
function normalizeSpreadsheetCell(v){
  if(v instanceof Date)return formatDateBr(v);
  const txt=String(v??"").trim();
  if(!txt)return "";
  const iso=txt.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:\s+\d{1,2}:\d{1,2}(?::\d{1,2})?)?$/);
  if(iso){
    const d=new Date(Number(iso[1]),Number(iso[2])-1,Number(iso[3]));
    return formatDateBr(d)||txt;
  }
  const slash=txt.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(slash){
    let a=Number(slash[1]),b=Number(slash[2]),y=Number(slash[3]);
    if(y<100)y+=2000;
    const looksUs=a<=12&&b>12;
    const day=looksUs?b:a;
    const month=looksUs?a:b;
    const d=new Date(y,month-1,day);
    if(d.getFullYear()===y&&d.getMonth()===month-1&&d.getDate()===day)return formatDateBr(d);
  }
  return txt;
}
let xlsxLibPromise=null;
async function loadScriptWithTimeout(src,timeoutMs=12000){
  return await new Promise((resolve,reject)=>{
    const sc=document.createElement("script");
    let done=false;
    const tm=setTimeout(()=>{
      if(done)return;
      done=true;
      sc.remove();
      reject(new Error("timeout"));
    },timeoutMs);
    sc.src=src;
    sc.async=true;
    sc.onload=()=>{
      if(done)return;
      done=true;
      clearTimeout(tm);
      resolve(true);
    };
    sc.onerror=()=>{
      if(done)return;
      done=true;
      clearTimeout(tm);
      sc.remove();
      reject(new Error("load_error"));
    };
    document.head.appendChild(sc);
  });
}
function ensureXlsxLib(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  if(xlsxLibPromise)return xlsxLibPromise;
  xlsxLibPromise=(async()=>{
    const sources=[
      "https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js",
      "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js",
      "https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"
    ];
    for(const src of sources){
      try{
        await loadScriptWithTimeout(src,12000);
        if(window.XLSX)return window.XLSX;
      }catch(_){}
    }
    throw new Error("xlsx_load_all_sources_failed");
  })();
  return xlsxLibPromise;
}
function normalizeParsedGrid(grid){
  const rows=(Array.isArray(grid)?grid:[])
    .map(r=>Array.isArray(r)?r.map(c=>normalizeSpreadsheetCell(c)):[])
    .filter(r=>r.some(c=>c!==""));
  if(!rows.length)return [];
  const firstDenseIdx=Math.max(0,rows.findIndex(r=>r.filter(Boolean).length>=3));
  const cut=rows.slice(firstDenseIdx);
  const maxCols=Math.max(...cut.map(r=>r.length),1);
  return cut.map(r=>{
    const out=r.slice(0,maxCols);
    while(out.length<maxCols)out.push("");
    return out;
  });
}
async function parseSpreadsheetFileToGrid(file){
  const name=String(file?.name||"");
  let ext=name.includes(".")?name.split(".").pop().toLowerCase():"";
  if(ext==="xllsm")ext="xlsm";
  if(["csv","txt"].includes(ext)){
    const txt=await file.text();
    return normalizeParsedGrid(parseTabularText(txt));
  }
  if(["xlsx","xls","xlsm","xlsb"].includes(ext)){
    const XLSX=await ensureXlsxLib();
    const ab=await file.arrayBuffer();
    const wb=XLSX.read(ab,{type:"array",cellDates:true});
    if(!Array.isArray(wb.SheetNames)||!wb.SheetNames.length)return [];
    const ws=wb.Sheets[wb.SheetNames[0]];
    const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:"",dateNF:"dd/mm/yyyy"});
    return normalizeParsedGrid(aoa);
  }
  if(["ods","odt"].includes(ext))throw new Error("unsupported_ods");
  throw new Error("unsupported_spreadsheet_type");
}

function parseBrDate(s){
  const txt=String(s||"").trim();
  const isoDateTime=txt.match(/^(\d{4})-(\d{1,2})-(\d{1,2})\s+\d{1,2}:\d{1,2}(:\d{1,2})?$/);
  if(isoDateTime){
    const y=Number(isoDateTime[1]),mo=Number(isoDateTime[2]),d=Number(isoDateTime[3]);
    const dt=new Date(y,mo-1,d);
    if(dt.getFullYear()===y&&dt.getMonth()===mo-1&&dt.getDate()===d)return dt;
  }
  const iso=txt.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(iso){
    const y=Number(iso[1]),mo=Number(iso[2]),d=Number(iso[3]);
    const dt=new Date(y,mo-1,d);
    if(dt.getFullYear()===y&&dt.getMonth()===mo-1&&dt.getDate()===d)return dt;
  }
  const m=txt.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(!m)return null;
  const d=Number(m[1]),mo=Number(m[2]),y=Number(m[3].length===2?("20"+m[3]):m[3]);
  if(!d||!mo||!y)return null;
  const dt=new Date(y,mo-1,d);
  if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return null;
  return dt;
}
function findLteColumnByHeader(headers,needle){
  const n=normalizeHeaderKey(needle);
  return headers.findIndex(h=>normalizeHeaderKey(h).includes(n));
}
function getLteProgrammedDateIndex(headers){
  const terms=["data programada","programada","data exec","execucao","data"];
  for(const t of terms){
    const idx=findLteColumnByHeader(headers,t);
    if(idx>-1)return idx;
  }
  return -1;
}
function inferVencimentoDays(row,headers){
  const idx=getLteProgrammedDateIndex(headers);
  if(idx<0)return "";
  const dt=parseBrDate(row[idx]);
  if(!dt)return "";
  const now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const target=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate());
  return Math.round((target-today)/(24*60*60*1000));
}
function upsertLteStatusAndDueColumns(view){
  const p=to2DPlanilha(view.planilha);
  let headers=[...p.headers];
  let rows=p.rows.map(r=>[...r]);
  if(!headers.length&&rows.length){
    headers=rows.shift();
  }
  if(!headers.length)headers=[...LTE_MODEL_BASE_HEADERS];
  const statusIdx=findLteColumnByHeader(headers,"status");
  let dueIdx=findLteColumnByHeader(headers,"severidade");
  const oldDueIdx=findLteColumnByHeader(headers,"data de vencimento");
  if(dueIdx<0&&oldDueIdx>-1){
    headers[oldDueIdx]="Severidade";
    dueIdx=oldDueIdx;
  }
  const sIdx=statusIdx>-1?statusIdx:headers.length;
  if(statusIdx<0)headers.push("Status");
  const dIdx=dueIdx>-1?dueIdx:headers.length;
  if(dueIdx<0)headers.push("Severidade");
  rows=rows.map(r=>{
    const out=[...r];
    while(out.length<headers.length)out.push("");
    out[sIdx]=normalizeStatus(out[sIdx]);
    out[dIdx]=String(inferVencimentoDays(out,headers));
    return out;
  });
  view.planilha={headers,rows};
}
function modelLteGrid(rawGrid){
  const cleaned=(Array.isArray(rawGrid)?rawGrid:[])
    .map(r=>Array.isArray(r)?r.map(c=>String(c??"").trim()):[])
    .filter(r=>r.some(c=>c!==""));
  const withoutFirstLine=cleaned.slice(1);
  const looksHeader=r=>{
    const txt=(Array.isArray(r)?r:[]).map(normalizeHeaderKey).join(" ");
    const hasId=/\bORDEM\b|\bESPECIALIDADE\b|\bTIPO\b/.test(txt);
    const hasContext=/DATA|PROG|TEXTO|LOCAL|TOLERANCIA|PLANEJADO/.test(txt);
    return hasId&&hasContext;
  };
  const headerIdx=withoutFirstLine.findIndex(looksHeader);
  const importIndexes=getLteImportIndexes();
  const headers=LTE_IMPORT_COLUMN_MAP.map(x=>x.header);
  const sourceRows=(headerIdx>=0?withoutFirstLine.slice(headerIdx+1):withoutFirstLine)
    .filter(r=>!looksHeader(r))
    .filter(r=>!r.some(c=>/QTD\.?\s*OPER\.?/i.test(String(c||""))));
  const orderIdx=columnLetterToIndex("C");
  const dataRows=sourceRows.filter(r=>{
    const order=String(r[orderIdx]||"").trim();
    if(!order||/ORDEM/i.test(order))return false;
    return importIndexes.some(idx=>String(r[idx]||"").trim()!=="");
  });
  const rows=dataRows.map(r=>{
    const out=importIndexes.map(idx=>normalizeSpreadsheetCell(r[idx]||""));
    while(out.length<headers.length)out.push("");
    return out.slice(0,headers.length);
  }).filter(r=>r.some(c=>c!==""));
  return{headers,rows};
}
function applyLteFilters(row,headers,f){
  const statusIdx=findLteColumnByHeader(headers,"status");
  const dueIdx=Math.max(findLteColumnByHeader(headers,"severidade"),findLteColumnByHeader(headers,"data de vencimento"));
  const progIdx=getLteProgrammedDateIndex(headers);
  const locIdx=findLteColumnByHeader(headers,"local");
  if(f.status&&statusIdx>-1&&normalizeStatus(row[statusIdx])!==normalizeStatus(f.status))return false;
  if(f.dataProgramada&&progIdx>-1&&!String(row[progIdx]||"").includes(f.dataProgramada))return false;
  if(f.localInstalacao&&locIdx>-1&&!String(row[locIdx]||"").toLowerCase().includes(String(f.localInstalacao).toLowerCase()))return false;
  if(f.dataVencimento&&dueIdx>-1&&!String(row[dueIdx]||"").includes(String(f.dataVencimento)))return false;
  if(f.toleranciaMax&&dueIdx>-1){
    const n=Number(f.toleranciaMax);
    const d=Number(row[dueIdx]);
    if(Number.isFinite(n)&&Number.isFinite(d)&&d>n)return false;
  }
  return true;
}

function parseMmssToSecs(v){
  const m=String(v||"").trim().match(/^(\d{1,2}):(\d{2})$/);
  if(!m)return null;
  const mm=Number(m[1]),ss=Number(m[2]);
  if(!Number.isFinite(mm)||!Number.isFinite(ss)||ss>59)return null;
  return mm*60+ss;
}

function readFbAuth(){
  try{
    const raw=localStorage.getItem(FB_AUTH_KEY);

    const d=JSON.parse(raw);
    if(!d||typeof d!=="object")return null;
    return d;
  }catch(_){return null;}

  try{localStorage.setItem(FB_AUTH_KEY,JSON.stringify(v||{}));}catch(_){}
}
function clearFbAuth(){
  try{localStorage.removeItem(FB_AUTH_KEY);}catch(_){}
}
async function refreshFirebaseIdToken(refreshToken){
  const url=`https://securetoken.googleapis.com/v1/token?key=${encodeURIComponent(FB_CFG.apiKey)}`;
  const body=new URLSearchParams({grant_type:"refresh_token",refresh_token:String(refreshToken||"")}).toString();
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body});
  const j=await r.json();
  if(!r.ok||!j?.id_token)throw new Error(j?.error?.message||"refresh_failed");
  return{
    idToken:j.id_token,
    refreshToken:j.refresh_token||refreshToken,
    email:j.user_id||"",
    expAt:Date.now()+((Number(j.expires_in)||3600)-60)*1000
  };
}
async function ensureFirebaseAdminAuth(){
  let auth=readFbAuth();
  const now=Date.now();
  if(auth?.idToken&&Number(auth.expAt||0)>now)return auth.idToken;
  if(auth?.refreshToken){
    try{
      const ref=await refreshFirebaseIdToken(auth.refreshToken);
      auth={...auth,...ref};
      writeFbAuth(auth);
      return auth.idToken;
    }catch(_){
      clearFbAuth();
    }
  }
  const email=prompt("Firebase admin email:");
  if(email===null)throw new Error("auth_cancelled");
  const pass=prompt("Senha Firebase:");
  if(pass===null)throw new Error("auth_cancelled");
  const e=String(email||"").trim().toLowerCase();
  if(!FIREBASE_ADMIN_EMAILS.includes(e))throw new Error("email_not_allowed");
  const signInUrl=`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${encodeURIComponent(FB_CFG.apiKey)}`;
  const sr=await fetch(signInUrl,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({email:e,password:String(pass||""),returnSecureToken:true})
  });
  const sj=await sr.json();
  if(!sr.ok||!sj?.idToken)throw new Error(sj?.error?.message||"signin_failed");
  auth={
    email:e,
    idToken:sj.idToken,
    refreshToken:sj.refreshToken||"",
    expAt:Date.now()+((Number(sj.expiresIn)||3600)-60)*1000
  };
  writeFbAuth(auth);
  return auth.idToken;
}
async function firebaseJsonRequest(url,options,authMode){
  try{
    const opts={...(options||{})};
    opts.headers={...(opts.headers||{})};
    if(authMode==="admin_write"){
      const token=await ensureFirebaseAdminAuth();
      opts.headers.Authorization=`Bearer ${token}`;
    }
    const r=await fetch(url,opts);
    const text=await r.text();
    let json=null;
    try{json=text?JSON.parse(text):null;}catch(_){}
    return{ok:r.ok,status:r.status,statusText:r.statusText,text,json};
  }catch(err){
    return{ok:false,status:0,statusText:"network_error",text:"",json:null,error:String(err?.message||err||"erro_rede")};
  }
}
function explainFirebaseError(res){
  if(!res)return"falha desconhecida";
  const emsg=res?.json?.error?.message||res?.error||"";
  if(String(emsg).includes("auth_cancelled"))return"autenticacao cancelada pelo usuario.";
  if(String(emsg).includes("email_not_allowed"))return"email nao permitido para escrita administrativa.";
  if(String(emsg).includes("INVALID_LOGIN_CREDENTIALS"))return"credenciais Firebase invalidas.";
  if(res.status===403)return`permissao negada (Firestore Rules). ${emsg||""}`.trim();
  if(res.status===401)return`nao autorizado (token/chave). ${emsg||""}`.trim();
  if(res.status===404)return`documento/colecao nao encontrado. ${emsg||""}`.trim();
  if(res.status===429)return`limite de requisicoes excedido. ${emsg||""}`.trim();
  if(res.status===0)return`falha de rede/CORS. ${emsg||""}`.trim();
  return`${res.status||"erro"} ${res.statusText||""} ${emsg||""}`.trim();
}
function fromFsFields(fields){
  const out={};
  const src=(fields&&typeof fields==="object")?fields:{};
  Object.keys(src).forEach(k=>{
    const v=src[k]||{};
    if(typeof v.stringValue==="string")out[k]=v.stringValue;
    else if(typeof v.integerValue==="string")out[k]=v.integerValue;
    else if(typeof v.doubleValue==="number")out[k]=String(v.doubleValue);
    else if(typeof v.booleanValue==="boolean")out[k]=v.booleanValue?"true":"false";
  });
  return out;
}

async function syncEvacBaseFromCloudOnBoot(){
  const cloudBase=await loadEvacFieldsBaseCloud();
  if(cloudBase){
    writeStore(EVAC_FIELDS_BASE_KEY,cloudBase);
    hydrateEvacFields(cloudBase);
    re();
  }
  const cloudScript=await loadEvacScriptBaseCloud();
  if(cloudScript){
    const next=normalizeEvacScriptText(cloudScript);
    writeStore(EVAC_SCRIPT_BASE_KEY,next);
    if(!S.evacScript||!S.evacScript.trim()||isLegacyEvacScriptText(S.evacScript))S.evacScript=next;
    re();
  }
}
async function syncEvacImagesFromIdbOnBoot(){
  try{
    let imgs=await readEvacImagesBySlotFromIdb();
    if(!imgs)imgs=await idbGet(EVAC_IMG_KEY);
    if(Array.isArray(imgs)&&imgs.length===3){
      S.evacImages=imgs.map(normEvacImage);

      S.evacImages.forEach((img,i)=>{writeStore(EVAC_IMG_SLOT_PREFIX+i,img);});
      re();
    }
  }catch(_){}
}

function loadAppState(){
  const st=readStore(APP_STATE_KEY,null);
  if(!st)return;
  if(st.enabled&&typeof st.enabled==="object")S.enabled={...S.enabled,...st.enabled};
  if(st.data&&typeof st.data==="object")S.data={...S.data,...st.data};
  if(st.imgs&&typeof st.imgs==="object")S.imgs={...S.imgs,...st.imgs};
  if(typeof st.evacScript==="string"&&st.evacScript.trim())S.evacScript=normalizeEvacScriptText(st.evacScript);
  if(st.theme==="day"||st.theme==="night")S.theme=st.theme;
  if(st.role==="admin"||st.role==="editor")S.role=st.role;
  if(typeof st.sidebarAutoCollapseV2==="boolean")S.sidebarAutoCollapse=st.sidebarAutoCollapseV2;
  if(Number.isFinite(Number(st.speechRate)))S.speechRate=Math.max(0.6,Math.min(1.4,Number(st.speechRate)));
  if(st.vpsState&&typeof st.vpsState==="object"){
    S.vps={
      tempoSolicitado:typeof st.vpsState.tempoSolicitado==="string"&&st.vpsState.tempoSolicitado.trim()?st.vpsState.tempoSolicitado.trim():"08:00",
      blocks:normalizeVpsBlocks(st.vpsState.blocks)
    };
  }
  if(st.lteGuideStates&&typeof st.lteGuideStates==="object"){
    LTE_STRUCT_GUIDES.forEach(id=>{
      if(st.lteGuideStates[id])setLteGuideState(id,st.lteGuideStates[id]);
    });
  }
  if(st.lteState&&typeof st.lteState==="object")setLteGuideState("sonda_lte",st.lteState);
  if(st.netState&&typeof st.netState==="object")setLteGuideState("sonda_net",st.netState);
  if(st.kpisState&&typeof st.kpisState==="object")S.kpis=normalizeKpisState(st.kpisState);
  if(st.weather&&typeof st.weather==="object")S.weather={...S.weather,...st.weather};
  hydrateEvacFields(readStore(EVAC_FIELDS_BASE_KEY,EVAC_DEFAULT_FIELDS));
}
function weatherSummary(v){
  if(!v)return"-";
  const s=String(v).toLowerCase();
  if(s.includes("chuva"))return "Chuva";
  if(s.includes("nublado"))return "Nublado";
  if(s.includes("sol"))return "Ensolarado";
  return String(v);
}
function escHtml(v){
  return String(v??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}
async function fetchWeatherFromInmet(){
  S.weather.loading=true;S.weather.error="";re();
  const targets=[
    {place:"parauapebas",name:"Parauapebas"},
    {place:"parauapebas",name:"Serra dos Carajas - Corredor Norte"},
    {place:"parauapebas",name:"Mina de Ferro Carajas"}
  ];
  try{
    let usedProxy=false;
    const rows=[];
    for(const t of targets){
      let j=null, stale=false;
      try{
        const purl=`http://127.0.0.1:8090/weather?place=${encodeURIComponent(t.place)}`;
        const pr=await fetch(purl,{cache:"no-store"});
        if(pr.ok){
          const pj=await pr.json();
          if(pj&&pj.ok&&pj.data){j=pj.data;usedProxy=true;stale=!!pj.stale;}
        }
      }catch(_){}
      if(!j||!j.forecast)throw new Error("sem_dados_proxy");
      const root=j.forecast||{};
      const geo=Object.keys(root||{})[0];
      const byDate=(geo&&root[geo])?root[geo]:root;
      const days=Object.keys(byDate||{}).sort((a,b)=>{
        const pa=a.split("/").reverse().join("-");
        const pb=b.split("/").reverse().join("-");
        return pa.localeCompare(pb);
      });
      const d=days[0]&&byDate[days[0]]?byDate[days[0]]:{};
      const seq=["manha","tarde","noite"].map(k=>d[k]).filter(Boolean);
      const now=seq[0]||{}, nxt=seq[1]||seq[0]||{};
      rows.push({
        name:t.name,
        now:weatherSummary(now.resumo||now.tempo||now.ceu||"-")+(stale?" (cache)":""),
        temp:(now.temp_max&&now.temp_min)?`${now.temp_min}C a ${now.temp_max}C`:(now.temp||"-"),
        hum:now.umidade_max?`${now.umidade_min||"-"}% a ${now.umidade_max}%`:(now.umidade||"-"),
        wind:now.vento||now.int_vento||"-",
        next3h:weatherSummary(nxt.resumo||nxt.tempo||nxt.ceu||"-")
      });
    }
    S.weather.items=rows;
    S.weather.updatedAt=new Date().toLocaleTimeString("pt-BR");
    S.weather.source=usedProxy?"INMET / Proxy local":"INMET";
  }catch(_){
    S.weather.error="Falha ao consultar INMET em tempo real no navegador.";
  }finally{
    S.weather.loading=false;re();
  }
}

function startTimer(){clearInterval(tInt);S.running=true;tInt=setInterval(()=>{S.bSecs++;S.tSecs++;updTimer();},1000);}
function stopTimer(){clearInterval(tInt);S.running=false;}
function updTimer(){
  const c=activeCompanies()[S.presIdx];if(!c)return;
  const lim=c.mins*60,left=lim-S.bSecs,pct=Math.min(100,S.bSecs/lim*100);
  const total=totalSecs();
  const td=document.getElementById("td"),tb=document.getElementById("tb"),totb=document.getElementById("totb"),totd=document.getElementById("totd");
  if(td){td.textContent=left>=0?fmt(left):"-"+fmt(-left);td.style.color=left<60?"var(--cr)":left<120?"var(--al)":"var(--gr)";}
  if(tb){tb.style.width=pct+"%";tb.style.background=pct>90?"var(--cr)":pct>70?"var(--al)":c.ac;}
  if(totb)totb.style.width=Math.min(100,S.tSecs/Math.max(total,1)*100)+"%";
  if(totd)totd.textContent=fmt(S.tSecs)+" / "+fmt(total);
  if(isLteStructGuide(c.id)){
    const lst=getLteGuideState(c.id);
    const reqEl=document.getElementById("lte-req");
    const realEl=document.getElementById("lte-real");
    const diffEl=document.getElementById("lte-diff");
    const diffWrap=document.getElementById("lte-diff-wrap");
    const reqSecs=parseMmssToSecs(lst?.tempoSolicitado||"");
    if(reqEl)reqEl.textContent=lst?.tempoSolicitado||"--:--";
    if(realEl)realEl.textContent=fmt(S.bSecs);
    if(diffEl){
      diffEl.textContent=reqSecs===null?"Formato invalido":fmtSignedSecs(S.bSecs-reqSecs);
    }
    if(diffWrap){
      diffWrap.style.color=reqSecs===null?"#B45309":((S.bSecs-reqSecs)>0?"#B91C1C":"#166534");
    }
  }
}

            <button class="lte-model-btn" onclick="addLteRow(${i})">+ Linha</button>
            <button class="lte-model-btn" onclick="addLteColumn(${i})">+ Coluna</button>
            <button class="lte-model-btn" onclick="removeLteTable(${i})">Remover Planilha</button>
            ${(()=>{const st=getLteSheetStats(row);return`<span class="lte-model-count">${st.total} linhas · ${st.reviewed} revisadas · ${st.pending} pendentes</span>`;})()}
          </div>
          ${(headers.length?columnPanel:"")}
          <div class="lte-model-wrap">
            ${headers.length?`
            <table class="lte-model-table">
              <colgroup>${gridCols}</colgroup>
              <thead><tr>${gridHead}<th style="border:.5px solid #163556;padding:5px;background:#062540;width:32px"></th></tr></thead>
              <tbody>${gridBody||`<tr><td colspan="${visibleIndexes.length+1}" style="padding:10px;text-align:center;font-size:10px;color:#93C5FD;background:#081a2d">Sem linhas na planilha.</td></tr>`}</tbody>
            </table>
            `:`<div style="padding:12px;text-align:center;font-size:11px;color:#6B7280">Sem planilha carregada.</div>`}
          </div>
        </div>
      </div>`:""}
      ${meta.hasImage?`<div style="margin-bottom:6px">
        <div style="font-size:9px;color:${c.ac};text-transform:uppercase;margin-bottom:3px">Imagem</div>
        <div class="lte-image-grid">${imageSlots}</div>
      </div>`:""}
      <div>
        <div style="font-size:9px;color:${c.ac};text-transform:uppercase;margin-bottom:3px">Texto livre</div>
        <textarea id="lte_txt_${i}" rows="3" oninput="setLteTextoLivre(${i},this.value)" placeholder="Digite observacoes complementares" style="width:100%;background:var(--bg);border:1px solid var(--cc);border-radius:7px;padding:.45rem .65rem;color:var(--gr);font-size:12px;line-height:1.45;resize:vertical">${escHtml(row.textoLivre||"")}</textarea>
      </div>
      </div>
    </div>`;
  }).join("");
  return`<div>
    ${wsHeader(c)}
    ${v1}
    ${cards}
    <button onclick="saveWS()" style="width:100%;padding:.55rem;border-radius:8px;background:var(--gv);border:none;color:#fff;font-weight:500;font-size:13px;cursor:pointer">Salvar</button>
  </div>`;
}

    const ok=filled(c.id);
    const on=S.enabled[c.id];
    return`<div onclick="openWS('${c.id}')" style="background:var(--wh);border:.5px solid ${ok?c.ac+"66":"var(--cc)"};border-left:3px solid ${c.ac};border-radius:8px;padding:.65rem .85rem;cursor:pointer;opacity:${on?1:.55}">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">

        <button onclick="event.stopPropagation();toggleGuide('${c.id}')" style="font-size:9px;padding:1px 6px;border-radius:20px;background:${on?c.ac+"15":"var(--bg)"};border:.5px solid ${on?c.ac+"44":"var(--cc)"};color:${on?c.ac:"var(--cm)"};font-weight:500;cursor:pointer">${on?(ok?"OK pronto":"ligada"):"ausente"}</button>

      <div class="portal-hero">
        <div class="portal-hero-main">
          <div class="portal-kicker">Painel principal</div>
          <div class="portal-hero-title">FMDS - Infratech Carajas</div>
        </div>
        <div class="portal-hero-meta">
          <div style="font-size:10px;color:rgba(255,255,255,.6)">${f} de ${activeCompanies().length} ativas prontas</div>
          <div style="font-size:13px;font-weight:500;color:#fff">${fmt(totalSecs())} total</div>
        </div>
      </div>
      <div class="portal-titlebar" style="margin:.65rem -.85rem 0;padding:0 .85rem">
        <div></div>
        <div class="portal-title">Sistema de Apresentacao FMDS</div>
        <div style="display:flex;align-items:center;justify-content:flex-end;gap:8px">
          <button onclick="startFMDS()" class="top-btn" style="background:var(--gv);border-color:var(--gv);color:#fff;padding:5px 12px;border-radius:8px;font-weight:600">Iniciar FMDS ></button>
          ${renderConfigMenu("portal")}
          <button onclick="exitApp()" class="top-btn" title="Sair" style="border-radius:20px;border-color:#D1D5DB;color:#334155;background:#F8FAFC;font-weight:700">⏻ Sair</button>
        </div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:1rem">${cards}</div>
  </div>`;
}

//  PRESENTATION 
function renderPresent(){
  const actives=activeCompanies();
  const done=S.presIdx>=actives.length;
  if(done)return`<div style="text-align:center;padding:2.5rem 0">
    <div style="font-size:32px;color:var(--gv);margin-bottom:8px">OK</div>
    <div style="font-size:16px;font-weight:500;color:var(--gr);margin-bottom:4px">FMDS encerrado</div>
    <div style="font-size:12px;color:var(--cm);margin-bottom:1.25rem">Duracao: ${fmt(S.tSecs)} / ${fmt(totalSecs())}</div>
    <button onclick="goHome()" style="padding:.5rem 1.5rem;border-radius:8px;background:var(--gv);border:none;color:#fff;font-weight:500;font-size:13px;cursor:pointer">Inicio</button>
  </div>`;

  const c=actives[S.presIdx];
  const isEvac=c.id==="plano_evac";
  const isVps=c.id==="vale_vps";
  const isLte=isLteStructGuide(c.id);
  const isKpis=c.id==="kpis";
  const flds=c.fields.filter(f=>S.data[c.id][f.k]?.trim());
  const evacBlock=isEvac?`
    <div style="background:#F0F7FF;border:.5px solid #BFDBFE;border-radius:7px;padding:.6rem .75rem;margin-bottom:.5rem">
      <div style="font-size:9px;font-weight:500;color:var(--bt);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.35rem">Inicio FMDS - Premissas de Seguranca</div>
      <div style="font-size:11px;color:var(--gr);line-height:1.6;white-space:pre-wrap;max-height:110px;overflow-y:auto">${S.evacScript}</div>
    </div>
    <div style="display:flex;gap:5px;margin-bottom:.5rem">
      ${S.evacImages.map((img,i)=>img
        ?`<div style="flex:1;cursor:pointer" onclick="openModal('${img.url}')">
            <img src="${img.url}" style="width:100%;height:48px;object-fit:cover;border-radius:6px;border:.5px solid var(--cc)"/>
            <div style="font-size:8px;color:var(--bt);text-align:center;margin-top:2px">Imagem ${i+1} - clique para ampliar</div>
          </div>`
        :`<div style="flex:1;height:48px;background:var(--bg);border:.5px dashed var(--cc);border-radius:6px;display:flex;align-items:center;justify-content:center">
            <span style="font-size:8px;color:#C4C9D4">Img ${i+1}</span>
          </div>`
      ).join("")}
    </div>`:"";
  const vpsHTML=isVps?(()=>{
    const reqSecs=parseMmssToSecs(S.vps?.tempoSolicitado||"");
    const diff=(reqSecs===null)?null:(S.bSecs-reqSecs);
    return `<div style="max-height:260px;overflow-y:auto;padding-right:2px">
    <div style="background:linear-gradient(105deg,#0B6FB8,#005E36);border:.5px solid #0EA5E9;border-radius:8px;padding:.5rem .65rem;margin-bottom:.45rem;box-shadow:0 6px 16px rgba(2,132,199,.18)">
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <div style="font-size:10px;color:#DBEAFE"><b>Tempo solicitado:</b> ${escHtml(S.vps?.tempoSolicitado||"--:--")}</div>
        <div style="font-size:10px;color:#F8FAFC"><b>Tempo real:</b> ${fmt(S.bSecs)}</div>
        <div style="font-size:10px;color:${diff===null?'#FDE68A':(diff>0?'#FECACA':'#BBF7D0')}"><b>Diferenca:</b> ${diff===null?'Formato invalido':fmtSignedSecs(diff)}</div>
      </div>
    </div>
    ${normalizeVpsBlocks(S.vps.blocks).filter(b=>b.enabled!==false).map((b,i)=>`<div style="background:var(--bg);border-radius:6px;padding:.4rem .65rem;border-left:2px solid ${c.ac}55;margin-bottom:4px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap">
        <div style="font-size:9px;font-weight:500;color:${c.ac};text-transform:uppercase;letter-spacing:.05em">${b.order}. ${b.title}</div>
        ${[8,9,11].includes(i)?`<div style="font-size:8px;padding:1px 6px;border-radius:999px;background:#EFF6FF;border:.5px solid #BFDBFE;color:#1D4ED8">${currentMonthLabel()}</div>`:""}
      </div>
      ${b.text?.trim()?`<div style="font-size:10px;color:var(--gr);line-height:1.35;white-space:pre-wrap;margin-top:2px">${escHtml(b.text).slice(0,240)}</div>`:`<div style="font-size:10px;color:var(--cm)">Sem texto</div>`}
      ${b.image?.url?`<img src="${b.image.url}" onclick="openModal('${b.image.url}')" style="margin-top:4px;width:140px;height:48px;object-fit:cover;border-radius:5px;border:.5px solid var(--cc);cursor:pointer"/>`:""}
    </div>`).join("")}
  </div>`;
  })():"";
  const lteHTML=isLte?(()=>{
    const l=getLteGuideState(c.id);
    const reqSecs=parseMmssToSecs(l.tempoSolicitado);
    const diff=(reqSecs===null)?null:(S.bSecs-reqSecs);
    const effective=getEffectiveLteViewsForPresentation(l);
    const d0Active=!!(l.views[3]&&l.views[3].enabled&&lteViewHasContent(l.views[3]));
    const metric=`<div style="background:linear-gradient(105deg,#0B6FB8,#005E36);border:.5px solid #0EA5E9;border-radius:8px;padding:.5rem .65rem;margin-bottom:.45rem;box-shadow:0 6px 16px rgba(2,132,199,.18)">
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <div style="font-size:10px;color:#DBEAFE"><b>Tempo solicitado:</b> <span id="lte-req">${escHtml(l.tempoSolicitado||"--:--")}</span></div>
        <div style="font-size:10px;color:#F8FAFC"><b>Tempo real:</b> <span id="lte-real">${fmt(S.bSecs)}</span></div>
        <div id="lte-diff-wrap" style="font-size:10px;color:${diff===null?'#FDE68A':(diff>0?'#FECACA':'#BBF7D0')}"><b>Diferenca:</b> <span id="lte-diff">${diff===null?'Formato invalido':fmtSignedSecs(diff)}</span></div>
      </div>
    </div>`;
    const rows=effective.map((row)=>{
      const i=l.views.findIndex(x=>x.id===row.id);
      const m=LTE_VIEWS_META[i];
      const imgs=normLteImageSlots(row.imagens,row.imagem).filter(x=>x.url||x.text);
      const img=imgs.length?`<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin-top:4px">${imgs.map(x=>`
        <div style="border:.5px solid var(--cc);border-radius:6px;padding:4px;background:var(--wh)">
          ${x.url?`<img src="${x.url}" onclick="openModal('${x.url}')" style="width:100%;height:52px;object-fit:cover;border-radius:5px;cursor:pointer"/>`:""}
          ${x.text?`<div style="font-size:9px;color:var(--gr);line-height:1.25;margin-top:3px">${escHtml(x.text)}</div>`:""}
        </div>`).join("")}</div>`:"";
      const plan=lteVisiblePlan(row);
      const tab=(Array.isArray(plan.rows)&&plan.rows.length)?`<div style="margin-top:4px">${renderGridPreview(plan)}</div>`:"";
      return`<div style="background:var(--bg);border-radius:6px;padding:.45rem .65rem;border-left:2px solid ${c.ac}88;margin-bottom:4px">
        <div style="font-size:9px;font-weight:600;color:${c.ac};text-transform:uppercase;letter-spacing:.05em">${m.title}</div>
        ${(!m.hasSheet&&row.observacoes?.trim())?`<div style="font-size:10px;color:var(--gr);white-space:pre-wrap"><b>${m.obsLabel}:</b> ${escHtml(row.observacoes)}</div>`:""}
        ${row.textoLivre?.trim()?`<div style="font-size:10px;color:var(--gr);white-space:pre-wrap">${escHtml(row.textoLivre)}</div>`:""}
        ${tab}${img}
      </div>`;
    }).join("");
    const badge=d0Active?`<div style="font-size:9px;color:#92400E;background:#FFFBEB;border:.5px solid #FDE68A;border-radius:6px;padding:.3rem .5rem;margin-bottom:.35rem">D0 ativo: views D-3, D-2 e D-1 ocultadas na apresentacao.</div>`:"";
    return`<div style="max-height:260px;overflow-y:auto;padding-right:2px">${metric}${badge}${rows||`<div style="font-size:10px;color:var(--cm);font-style:italic">Nenhuma view LTE ligada para exibicao.</div>`}</div>`;
  })():"";
  const kpisHTML=isKpis?(()=>{
    const k=normalizeKpisState(S.kpis);
    return`<div style="max-height:260px;overflow-y:auto;padding-right:2px">
      ${k.instrucoes?.trim()?`<div style="background:var(--bg);border-radius:6px;padding:.4rem .65rem;border-left:2px solid ${c.ac}55;margin-bottom:4px"><div style="font-size:9px;font-weight:500;color:${c.ac};text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px">Instrucoes</div><div style="font-size:11px;color:var(--gr);line-height:1.45;white-space:pre-wrap">${escHtml(k.instrucoes)}</div></div>`:""}
      ${k.views.filter(v=>v.enabled).map((v,vi)=>{
        const m=KPIS_VIEWS_META[vi];
        const imgs=v.imagens.filter(img=>img.url||img.text);
        return `<div style="background:var(--bg);border:.5px solid ${m.ac}44;border-left:2px solid ${m.ac};border-radius:6px;padding:.4rem .65rem;margin-bottom:4px">
          <div style="font-size:9px;font-weight:700;color:${m.ac};text-transform:uppercase;letter-spacing:.04em">${m.title}</div>
          ${v.observacoes?.trim()?`<div style="font-size:10px;color:var(--gr);white-space:pre-wrap;margin-top:2px">${escHtml(v.observacoes)}</div>`:""}
          ${v.textoLivre?.trim()?`<div style="font-size:10px;color:var(--cm);white-space:pre-wrap;margin-top:2px">${escHtml(v.textoLivre)}</div>`:""}
          ${imgs.length?`<div style="display:grid;grid-template-columns:repeat(4,minmax(95px,1fr));gap:4px;margin-top:4px">${imgs.map(x=>`<div style="background:#fff;border:.5px solid var(--cc);border-radius:5px;padding:3px"><img src="${x.url}" onclick="openModal('${x.url}')" style="width:100%;height:50px;object-fit:cover;border-radius:4px;cursor:pointer"/>${x.text?`<div style="font-size:8px;color:var(--cm);line-height:1.2;margin-top:2px">${escHtml(x.text)}</div>`:""}</div>`).join("")}</div>`:""}
        </div>`;
      }).join("")}
    </div>`;
  })():"";
  const dataHTML=isVps
    ?vpsHTML
    :isLte
      ?lteHTML
      :isKpis
        ?kpisHTML
        :flds.length
          ?flds.map(f=>`
    <div style="background:var(--bg);border-radius:6px;padding:.4rem .65rem;border-left:2px solid ${c.ac}55;margin-bottom:4px">
      <div style="font-size:9px;font-weight:500;color:${c.ac};text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px">${f.l}</div>
      <div style="font-size:12px;color:var(--gr);line-height:1.5;white-space:pre-wrap">${S.data[c.id][f.k]}</div>
    </div>`).join("")
          :(isEvac?"":`<div style="font-size:11px;color:var(--cm);font-style:italic">Script padrao do agente.</div>`);
  const imgH=(isLte||isVps||isKpis)?"":(S.imgs[c.id]?.length?`<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:5px">${S.imgs[c.id].map((img,i)=>`<img src="${img.url}" onclick="openModal('${img.url}')" style="height:48px;border-radius:6px;border:.5px solid var(--cc);cursor:pointer"/>`).join("")}</div>`:"");
  const ovH=S.overflow?`<div style="background:#FFFBEB;border:.5px solid var(--al);border-radius:8px;padding:.65rem;margin-bottom:.65rem">
    <div style="font-size:11px;font-weight:500;color:#92400E;margin-bottom:2px">Tempo Overflow Session</div>
    <div style="font-size:10px;color:#B45309">Tempo excedido. Sugestao: +10 min. Registre na ata.</div>
  </div>`:"";

  return`<div>
    <div style="background:linear-gradient(90deg,var(--gv),var(--bt));padding:.55rem .85rem;border-radius:8px;margin-bottom:.7rem;display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;align-items:center;gap:5px">
        <button onclick="goHome()" style="padding:3px 8px;border-radius:5px;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:10px;cursor:pointer">Inicio</button>
        <button onclick="prevBlock()" ${S.presIdx===0?"disabled":""} style="padding:3px 8px;border-radius:5px;background:${S.presIdx===0?"transparent":"rgba(255,255,255,.15)"};border:none;color:${S.presIdx===0?"rgba(255,255,255,.3)":"#fff"};font-size:10px;cursor:${S.presIdx===0?"default":"pointer"}">< Voltar</button>
      </div>
      <div id="totd" style="font-size:10px;color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums">00:00 / ${fmt(totalSecs())}</div>
    </div>
    <div style="height:3px;background:var(--cc);border-radius:2px;overflow:hidden;margin-bottom:.7rem">
      <div id="totb" style="height:3px;background:var(--gv);border-radius:2px;width:0%;transition:width .5s"></div>
    </div>
    <div style="background:var(--wh);border:.5px solid var(--cc);border-left:3px solid ${c.ac};border-radius:8px;padding:.85rem;margin-bottom:.6rem">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:.6rem">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:32px;height:32px;border-radius:50%;background:${c.ac}18;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:${c.ac}">${c.init}</div>
          <div><div style="font-size:14px;font-weight:500;color:var(--gr)">${c.name}</div><div style="font-size:10px;color:var(--cm)">${c.sub}</div></div>
        </div>
        <div style="text-align:right">
          <div id="td" style="font-size:22px;font-weight:500;color:var(--gr);font-variant-numeric:tabular-nums">--:--</div>
          <div style="font-size:9px;color:var(--cm)">restante</div>
        </div>
      </div>
      <div style="height:3px;background:var(--cc);border-radius:2px;overflow:hidden;margin-bottom:.6rem">
        <div id="tb" style="height:3px;border-radius:2px;background:${c.ac};width:0%;transition:width .5s"></div>
      </div>
      <div style="background:var(--bg);border:.5px solid var(--cc);border-radius:6px;padding:.45rem .65rem;margin-bottom:.6rem;display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:6px">
          <div style="width:6px;height:6px;border-radius:50%;background:${S.manual?"var(--al)":"var(--bt)"};animation:pulse 1.4s infinite"></div>
          <div style="font-size:10px;color:${S.manual?"#92400E":"var(--bt)"};font-weight:500">${S.manual?"Apresentador conduz":"Agente virtual ativo"}</div>
          <div id="sp-wv" class="wv" style="display:${S.speaking?"inline-flex":"none"}"><span></span><span></span><span></span><span></span><span></span></div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end">
          <button onclick="cycleSpeechRate()" title="Controle de velocidade do narrador" style="padding:3px 9px;border-radius:20px;background:#F7FBF9;border:1px solid #B7DCCB;color:#075E3C;font-size:10px;cursor:pointer;font-weight:600">Velocidade ${speechRateLabel()}</button>
          <button id="sp-btn" onclick="toggleSpeak()" style="padding:3px 10px;border-radius:20px;background:${S.speaking?"var(--bt)":"transparent"};border:1px solid var(--bt);color:${S.speaking?"#fff":"var(--bt)"};font-size:10px;cursor:pointer;font-weight:500">${S.speaking?"Parar":"Narrador Virtual"}</button>
        </div>
      </div>
      ${evacBlock}${dataHTML}${imgH}
    </div>
    ${ovH}
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button onclick="toggleRun()" style="padding:.38rem .85rem;border-radius:7px;background:transparent;border:1px solid var(--cc);color:var(--cm);font-size:11px;cursor:pointer">${S.running?"Pausar Pausar":"Retomar Retomar"}</button>
      <button onclick="toggleManual()" style="padding:.38rem .85rem;border-radius:7px;background:transparent;border:1px solid ${S.manual?"var(--al)":"var(--cc)"};color:${S.manual?"#92400E":"var(--cm)"};font-size:11px;cursor:pointer">${S.manual?"< Agente":"Assumir"}</button>
      <button onclick="toggleOverflow()" style="padding:.38rem .85rem;border-radius:7px;background:transparent;border:1px solid ${S.overflow?"var(--al)":"var(--cc)"};color:${S.overflow?"#92400E":"var(--cm)"};font-size:11px;cursor:pointer">Overflow</button>
      <button onclick="nextBlock()" style="flex:1;padding:.38rem .85rem;border-radius:7px;background:var(--gv);border:none;color:#fff;font-weight:500;font-size:11px;cursor:pointer">Proximo ></button>
    </div>
  </div>`;
}

//  MODAL 
function renderModal(){
  if(!S.modalImg)return"";

function renderMain(){
  if(S.view==="portal")return renderPortal();
  if(S.view==="workspace"){
    if(S.selId==="plano_evac")return renderEvacWS();
    if(S.selId==="vale_vps")return renderVpsWS();
    if(isLteStructGuide(S.selId))return renderSondaLteWS();
    if(S.selId==="sonda_adm"||S.selId==="stefanini")return renderExecutiveWS(S.selId);
    if(S.selId==="kpis")return renderKpisWS();
    return renderGenericWS();
  }
  if(S.view==="present")return renderPresent();
  return"";
}

function re(){
  const prevMain=document.getElementById("main");
  const prevScroll=prevMain?prevMain.scrollTop:0;
  const ae=document.activeElement;
  const focusId=(ae&&ae.id)?ae.id:"";
  const selStart=(ae&&typeof ae.selectionStart==="number")?ae.selectionStart:null;
  const selEnd=(ae&&typeof ae.selectionEnd==="number")?ae.selectionEnd:null;
  document.body.classList.toggle("night",S.theme==="night");
  const app=document.getElementById("app");
  const mainOffset=S.sidebarAutoCollapse?"56px":"0";
  app.innerHTML=renderSidebar()
    +`<div id="main" class="fade" style="flex:1;padding:0;background:var(--bg);margin-left:${mainOffset}">${renderMain()}</div>`
    +renderModal();
  const nextMain=document.getElementById("main");
  if(nextMain)nextMain.scrollTop=prevScroll;
  if(focusId){
    const target=document.getElementById(focusId);
    if(target){
      target.focus({preventScroll:true});
      if(selStart!==null&&selEnd!==null&&typeof target.setSelectionRange==="function"){
        try{target.setSelectionRange(selStart,selEnd);}catch(_){}
      }
    }
  }
  attachEv();
  if(S.view==="present"&&S.running)updTimer();
  if(S.view==="present")updSUI();
}

function attachEv(){
  if(S.view==="workspace"){
    if(S.selId==="plano_evac"){
      const sc=document.getElementById("evac-script");
      if(sc)sc.addEventListener("input",e=>{S.evacScript=e.target.value;saveEvacScript();saveAppState();});
      COMPANIES[0].fields.forEach(f=>{const el=document.getElementById("f_"+f.k);if(el)el.addEventListener("input",e=>{S.data["plano_evac"][f.k]=e.target.value;saveAppState();});});
    } else {
      const c=COMPANIES.find(x=>x.id===S.selId);
      if(c){
        c.fields.forEach(f=>{const el=document.getElementById("f_"+f.k);if(el)el.addEventListener("input",e=>{S.data[c.id][f.k]=e.target.value;saveAppState();});});
      }
    }
  }
  clearInterval(cInt);
  cInt=setInterval(()=>{
    const d=new Date();
    const t=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0");
    const el=document.getElementById("sb-clock");
    if(el)el.textContent=t;
  },1000);
}
